# FRANK event transport — NATS JetStream
#
# Spec: FRANK-§16.2 "Event transport | NATS JetStream | Outbox remains durability anchor";
#       FRANK-§12.4 (event transport); FRANK-§16.6 (workflow/event store disk quota);
#       FRANK-§16.7 "NATS/Valkey | Transport/cache | Rebuild from PostgreSQL outbox or
#       source | May be discarded | 15 minutes".
#       FRANK-§15.6 "Databases, Valkey, NATS, workflow service, object storage, identity
#       admin, and observability remain on private networks."
#
# JetStream is enabled because FRANK needs at-least-once delivery and consumer replay, but
# the PostgreSQL transactional outbox (ADR-004) remains the durability anchor: if this store
# is lost, events are re-emitted from the outbox. That is what justifies the hard caps below
# rather than an unbounded stream store.
#
# $VARIABLES are resolved from the container environment at startup. No credential is
# committed to this file (FRANK-§17.2).

server_name: frank-cell-nats

listen: 0.0.0.0:4222

# Monitoring endpoint. Bound inside the container network only, never published, and used by
# the container healthcheck (/healthz). FRANK-§16.3: admin surfaces get no public route.
http: 0.0.0.0:8222

# --- Authentication -----------------------------------------------------------------------
# FRANK-§15.2: workload identities for services, no shared human credentials. Slice 1 uses a
# single cell workload user; per-service NKEY/JWT accounts land with the Capability Broker.
authorization {
  user: $FRANK_NATS_USER
  password: $FRANK_NATS_PASSWORD
  timeout: 3
}

# --- JetStream --------------------------------------------------------------------------
# Caps are hard so a runaway publisher cannot consume the shared host's disk out from under
# the six unrelated projects that share it. These map to FRANK-§16.6's
# "workflow/event stores" disk quota, scaled to this host (see README).
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: $FRANK_NATS_MAX_MEMORY_STORE
  max_file_store: $FRANK_NATS_MAX_FILE_STORE
  sync_interval: "2m"
}

# --- Limits -------------------------------------------------------------------------------
# FRANK-§6.7 event envelopes are small; large payloads go to object storage and travel as a
# reference. A 4 MiB ceiling makes that contract enforceable at the transport.
max_payload: 4194304
max_connections: 512
max_control_line: 4096
max_pending: 33554432
write_deadline: "10s"
ping_interval: "30s"
ping_max: 3

# --- Logging (FRANK-§2.5: 24-hour, ISO 8601 in logs) --------------------------------------
# stdout only, so the size-capped Docker json-file driver owns retention.
debug: false
trace: false
logtime: true
logtime_utc: true

# --- Clustering -------------------------------------------------------------------------
# Deliberately absent. FRANK is a single private cell (FRANK-§2.4); the recovery path is the
# warm cell of FRANK-§16.1, not a NATS cluster stretched across hosts.
