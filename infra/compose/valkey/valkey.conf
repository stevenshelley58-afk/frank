# FRANK cache and ephemeral coordination — Valkey
#
# Spec: FRANK-§16.2 "Cache and ephemeral coordination | Valkey | Open, replaceable, and
#       never canonical"; FRANK-§16.7 "NATS/Valkey | Transport/cache | Rebuild from
#       PostgreSQL outbox or source | May be discarded".
#
# Because this store may be discarded, it is configured to discard: no persistence, LRU
# eviction, and a maxmemory well inside the container's 512 MiB hard limit. It is also the
# only service in the cell with a POSITIVE oom_score_adj — under host memory pressure this
# is the correct thing to lose.

bind 0.0.0.0
port 6379
protected-mode yes

# requirepass is supplied on the command line from FRANK_VALKEY_PASSWORD so no secret is
# ever written into a committed file (FRANK-§17.2: infrastructure code contains no secrets).

# --- Memory -------------------------------------------------------------------------------
# 384 MiB of a 512 MiB container limit. The gap is Valkey's own overhead plus copy-on-write
# headroom; setting maxmemory equal to mem_limit is how a cache gets OOM-killed instead of
# evicting.
maxmemory 384mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# --- Persistence: none --------------------------------------------------------------------
# Nothing here is canonical, so nothing here is written to disk. This also keeps the cell off
# the shared host's disk budget for a store that is rebuildable by definition.
save ""
appendonly no
stop-writes-on-bgsave-error no
rdbcompression no
rdbchecksum no

# --- Connection handling ------------------------------------------------------------------
timeout 0
tcp-keepalive 60
tcp-backlog 511
databases 8

# --- Logging (FRANK-§2.5: 24-hour, ISO 8601 in logs) --------------------------------------
loglevel notice
logfile ""

# --- Safety: no admin surface from application connections --------------------------------
# FRANK-§15.9 kill controls live in FRANK, not in an ad-hoc Valkey shell. Rename the
# commands that can destroy or reshape the cell's cache out of existence.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""

# --- Lazy free: keep evictions off the command path ---------------------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
