# FRANK identity cache — Valkey instance dedicated to Authentik
#
# Spec: FRANK-§16.2 (Authentik through OIDC), FRANK-§5.3 (failure-domain rules),
#       FRANK-§16.6 (identity must not be evicted by other work),
#       FRANK-§16.7 "Authentik | ... 5 minutes; sessions may be revoked".
#
# WHY THIS EXISTS SEPARATELY FROM frank-valkey:
#   The FRANK cache runs `allkeys-lru`. Authentik stores sessions, channel layers and task
#   state here and must run `noeviction` — under cache pressure it needs errors, not silent
#   key loss. Sharing one instance would turn an ordinary cache-pressure event into an
#   identity outage, which FRANK-§5.3 and the FRANK-§16.6 priority rule forbid.
#   Cost of the separation: 192 MiB.
#
# FRANK-§16.7 accepts that sessions may be revoked on loss of this store, so it is still not
# canonical and still not backed up.

bind 0.0.0.0
port 6379
protected-mode yes

# requirepass supplied on the command line from FRANK_AUTHENTIK_REDIS_PASSWORD.

# --- Memory -------------------------------------------------------------------------------
# 128 MiB inside a 192 MiB container limit. noeviction: fail loudly rather than silently drop
# a session or a queued identity task.
maxmemory 128mb
maxmemory-policy noeviction

# --- Persistence: none --------------------------------------------------------------------
save ""
appendonly no
stop-writes-on-bgsave-error no

# --- Connection handling ------------------------------------------------------------------
timeout 0
tcp-keepalive 60
databases 4

loglevel notice
logfile ""

# Authentik needs CONFIG at startup (django-redis / channels probes), so CONFIG is left in
# place here; the destructive commands are not.
rename-command FLUSHALL ""
rename-command SHUTDOWN ""
rename-command DEBUG ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""

lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
