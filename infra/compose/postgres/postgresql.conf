# FRANK canonical database — PostgreSQL 17 server configuration
#
# Spec: FRANK-§16.2 (PostgreSQL, extensions limited and pinned, pgvector baseline),
#       FRANK-§16.6 (memory envelope and OOM priority), FRANK-§16.7 (WAL protection),
#       FRANK-§2.5 (ISO 8601, 24-hour, IANA rules — never a fixed UTC offset),
#       FRANK-§11.1 (data standards).
#
# Sized for the container's hard `mem_limit` of 4096 MiB (FRANK_MEM_POSTGRES). If you raise
# that limit, raise shared_buffers and effective_cache_size together, or the extra memory is
# never used. If you LOWER it below shared_buffers + maintenance_work_mem + a per-connection
# allowance, the container will be OOM-killed on the first heavy query — recompute first.

# --- Connections -----------------------------------------------------------------------
listen_addresses = '*'                  # container-private network only; never published
port = 5432
max_connections = 120                   # domain API + Temporal + Authentik + workers
superuser_reserved_connections = 5
password_encryption = 'scram-sha-256'   # §15.2: no shared human credentials, strong auth

# --- Memory — budget against the 4096 MiB container limit --------------------------------
#   shared_buffers          1024 MiB   (25% of the limit — the standard starting point)
#   effective_cache_size    2560 MiB   (planner hint: buffers + expected page cache)
#   maintenance_work_mem     256 MiB   (VACUUM, CREATE INDEX, ivfflat/hnsw builds)
#   work_mem                  12 MiB   x concurrent sort/hash nodes — the elastic term
#   worst realistic peak  ~ 1024 + 256 + (120 x 12 x ~1.5) ≈ 3.4 GiB, inside 4096 MiB.
shared_buffers = 1024MB
effective_cache_size = 2560MB
maintenance_work_mem = 256MB
work_mem = 12MB
hash_mem_multiplier = 1.5
temp_buffers = 16MB
max_stack_depth = 4MB
# huge_pages: `try` is wrong inside a memory-capped container on a shared host — an
# unexpected hugepage reservation would be taken from the other six projects.
huge_pages = off

# --- Parallelism — bounded by the container's 2.0 CPU cap --------------------------------
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Write-ahead log — §16.7 -------------------------------------------------------------
# wal_level = replica is set now, even though no standby exists yet, because raising it
# later requires a restart. This makes the warm recovery standby and PITR of §16.7 an
# additive change rather than an outage.
wal_level = replica
max_wal_senders = 4
max_replication_slots = 4
wal_keep_size = 512MB
wal_compression = zstd
min_wal_size = 256MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
synchronous_commit = on
full_page_writes = on

# Continuous WAL archiving (§16.7, 5-minute recovery point) is DELIBERATELY OFF here.
# Reason: this is a shared host with ~191 GB free carrying six other production projects.
# An archive with no shipping-and-pruning job attached is an unbounded disk-fill vector
# against those projects. Turn it on together with the off-cell backup automation, which is
# a Slice 8 / Workstream 3 deliverable, not a Slice 1 compose concern.
# To enable (the frank-cell-postgres-wal-archive volume is already mounted at /wal-archive):
#   archive_mode = on
#   archive_timeout = 300              # 300s == the §16.7 five-minute recovery point
#   archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
# and add the pruning + off-cell shipping job before the first archive is written.
archive_mode = off

# --- Autovacuum --------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_limit = 1000

# --- Storage assumptions (NVMe) ----------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200
default_statistics_target = 100

# --- Extensions — §16.2 "Extensions limited and pinned" ----------------------------------
# Only pg_stat_statements is preloaded. `vector`, `pgcrypto` and `pg_stat_statements` are
# the complete allowed set and are created per-database by initdb/10-extensions.sh.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off
# §15.7 / §2.3: query text can carry owner data. Do not let it leak into telemetry unredacted.
compute_query_id = on

# --- Time — §2.5 -------------------------------------------------------------------------
# Storage and server-side time are UTC. Steven's home zone is `Australia/Perth` and reaches
# the product as an IANA name applied at render/recurrence time — never as a fixed +08:00
# offset baked into stored data. Container TZ is Australia/Perth for operator shell use;
# these two settings make sure that never contaminates the database or its logs.
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
intervalstyle = 'iso_8601'

# --- Logging — §2.5 (24-hour, ISO 8601) and §15.7 (redaction) ----------------------------
logging_collector = off                  # stdout -> Docker json-file driver, size-capped
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d/%a '  # %m is ISO 8601 in UTC given log_timezone above
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000        # slow-query evidence only
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 4096
log_autovacuum_min_duration = 1000
log_statement = 'ddl'                    # never 'all': statements can contain owner data
log_error_verbosity = default
track_io_timing = on
track_functions = pl

# --- Safety ------------------------------------------------------------------------------
statement_timeout = 0                    # set per-role/per-connection by the domain API
lock_timeout = 30s
idle_in_transaction_session_timeout = 300s
deadlock_timeout = 1s
restart_after_crash = on
