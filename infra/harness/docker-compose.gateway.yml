# Private harness gateway overlay. Apply only with the production application Compose pair.
# All images come from a reviewed CURRENT slot; candidate promotion is manual and fail-closed.
services:
  frank-litellm:
    image: "${FRANK_LITELLM_CURRENT_IMAGE:?digest-pinned reviewed LiteLLM current image required}"
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    networks: [frank-harness-model]
    volumes: ["./litellm/config.yaml:/etc/litellm/config.yaml:ro"]
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?required}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?required}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:?required}"
      CONCENTRATE_API_BASE: "${CONCENTRATE_API_BASE:?required}"
      CONCENTRATE_API_KEY: "${CONCENTRATE_API_KEY:?required}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?required}"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: "0.75"
    pids_limit: 256
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health/readiness"], interval: 15s, timeout: 5s, retries: 8 }
  frank-seaweedfs-attachments:
    image: "${FRANK_SEAWEEDFS_CURRENT_IMAGE:?digest-pinned reviewed SeaweedFS current image required}"
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      sed -e "s|__STAGING_KEY__|$$FRANK_ATTACHMENT_STAGING_ACCESS_KEY|g"
      -e "s|__STAGING_SECRET__|$$FRANK_ATTACHMENT_STAGING_SECRET_KEY|g"
      -e "s|__PROMOTER_KEY__|$$FRANK_ATTACHMENT_PROMOTER_ACCESS_KEY|g"
      -e "s|__PROMOTER_SECRET__|$$FRANK_ATTACHMENT_PROMOTER_SECRET_KEY|g"
      /etc/seaweedfs/s3-attachments.json.tmpl > /run/s3.json &&
      exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/run/s3.json -ip=frank-seaweedfs-attachments
    networks: [frank-harness-attachments]
    environment:
      FRANK_ATTACHMENT_STAGING_ACCESS_KEY: "${FRANK_ATTACHMENT_STAGING_ACCESS_KEY:?required}"
      FRANK_ATTACHMENT_STAGING_SECRET_KEY: "${FRANK_ATTACHMENT_STAGING_SECRET_KEY:?required}"
      FRANK_ATTACHMENT_PROMOTER_ACCESS_KEY: "${FRANK_ATTACHMENT_PROMOTER_ACCESS_KEY:?required}"
      FRANK_ATTACHMENT_PROMOTER_SECRET_KEY: "${FRANK_ATTACHMENT_PROMOTER_SECRET_KEY:?required}"
    volumes: ["frank-attachment-pool:/data", "./seaweedfs/s3-attachments.json.tmpl:/etc/seaweedfs/s3-attachments.json.tmpl:ro"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m", "/run:rw,nosuid,nodev,noexec,size=1m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024m
    cpus: "0.75"
    pids_limit: 384
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"], interval: 15s, timeout: 5s, retries: 10 }
  frank-clamav:
    image: "${FRANK_CLAMAV_CURRENT_IMAGE:?digest-pinned reviewed ClamAV current image required}"
    networks: [frank-harness-attachments]
    volumes: ["frank-clamav-signatures:/var/lib/clamav"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: "1.0"
    pids_limit: 256
    healthcheck: { test: ["CMD-SHELL", "clamdscan --version >/dev/null && test -s /var/lib/clamav/daily.cvd -o -s /var/lib/clamav/daily.cld"], interval: 30s, timeout: 10s, retries: 12, start_period: 120s }
  frank-tusd:
    image: "${FRANK_TUSD_CURRENT_IMAGE:?digest-pinned reviewed tusd current image required}"
    command: ["-s3-bucket=frank-attachment-staging", "-s3-object-prefix=${FRANK_CELL_ID:?required}/", "-max-size=2147483648", "-hooks-http=${FRANK_TUSD_HOOK_URL:?private HTTPS hook required}", "-hooks-http-forward-headers=Upload-Metadata", "-disable-download", "-disable-termination", "-disable-concatenation"]
    environment:
      AWS_ACCESS_KEY_ID: "${FRANK_ATTACHMENT_STAGING_ACCESS_KEY:?required}"
      AWS_SECRET_ACCESS_KEY: "${FRANK_ATTACHMENT_STAGING_SECRET_KEY:?required}"
      AWS_ENDPOINT: "http://frank-seaweedfs-attachments:8333"
    networks: [frank, frank-harness-attachments]
    depends_on:
      frank-clamav: { condition: service_healthy }
      frank-seaweedfs-attachments: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: "0.5"
    pids_limit: 128
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1080/healthz"], interval: 15s, timeout: 5s, retries: 8 }
  frank-letta:
    image: "${FRANK_LETTA_CURRENT_IMAGE:?digest-pinned reviewed Letta current image required}"
    networks: [frank]
    environment: { LETTA_SERVER_HOST: "0.0.0.0", LETTA_SERVER_PORT: "8283", LETTA_MANUAL_ONLY: "true" }
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: "0.75"
    pids_limit: 256
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8283/v1/health"], interval: 15s, timeout: 5s, retries: 8 }
  frank-hermes:
    image: "${FRANK_HERMES_CURRENT_IMAGE:?digest-pinned reviewed Hermes current image required}"
    profiles: [harness-specialist]
    networks: [frank, frank-harness-model]
    environment: { HERMES_API_SEAM_URL: "${FRANK_HERMES_API_SEAM_URL:?required}", OPENAI_BASE_URL: "http://frank-litellm:4000/v1", HERMES_BROWSER_PROFILE: "research-constrained", HERMES_DISABLE_SCHEDULER: "true", HERMES_DISABLE_CHILD_AGENTS: "true" }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 256
networks:
  frank: { external: true, name: frank }
  frank-harness-model: { internal: true, name: frank-harness-model }
  frank-harness-attachments: { internal: true, name: frank-harness-attachments }
volumes:
  # Planned only: capacity gate refuses deployment below 30 GiB free. Do not allocate here.
  frank-attachment-pool: { name: frank-attachment-pool }
  frank-clamav-signatures: { name: frank-clamav-signatures }
