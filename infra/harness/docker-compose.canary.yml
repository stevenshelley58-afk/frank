# Disposable canary only. It deliberately has no external network or external volume.
name: ${FRANK_HARNESS_CANARY_PROJECT:?set a disposable project name}
services:
  litellm:
    image: ${FRANK_LITELLM_CANDIDATE_IMAGE:?digest required}
    networks: [canary-model]
    read_only: true
    tmpfs: [/tmp]
    command: ["--port", "4000"]
  seaweedfs:
    image: ${FRANK_SEAWEEDFS_CANDIDATE_IMAGE:?digest required}
    command: [server, -dir=/data, -s3, -s3.config=/etc/seaweedfs/s3.json]
    networks: [canary-attachments]
    volumes:
      - seaweedfs-canary:/data
      - ${FRANK_CANARY_S3_CONFIG:?canary S3 config required}:/etc/seaweedfs/s3.json:ro
    read_only: true
    tmpfs: [/tmp]
  tusd:
    image: ${FRANK_TUSD_CANDIDATE_IMAGE:?digest required}
    networks: [canary-attachments]
    command: ["-behind-proxy", "-base-path=/v1/uploads/tus/", "-s3-bucket=canary-staging", "-s3-endpoint=http://seaweedfs:8333", "-max-size=2147483648", "-hooks-http=http://gate:8080/hooks", "-hooks-enabled-events=pre-create,pre-finish,pre-terminate,post-finish,post-terminate", "-disable-download", "-disable-concatenation"]
    environment:
      AWS_ACCESS_KEY_ID: canary-staging
      AWS_SECRET_ACCESS_KEY: canary-staging-secret
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
    read_only: true
    tmpfs: [/tmp]
  gate:
    image: busybox:1.37.0
    networks: [canary-attachments]
    # Synthetic canary hook receiver. It has no production credential or route.
    command: ["sh", "-ec", "while true; do printf 'HTTP/1.1 204 No Content\\r\\nContent-Length: 0\\r\\n\\r\\n' | nc -lp 8080; done"]
    read_only: true
    tmpfs: [/tmp]
  probe:
    image: alpine:3.22.2
    networks: [canary-model, canary-attachments]
    command: ["sh", "-ec", "trap : TERM INT; while :; do sleep 3600; done"]
    read_only: true
    tmpfs: [/tmp]
  clamav:
    image: ${FRANK_CLAMAV_CANDIDATE_IMAGE:?digest required}
    networks: [canary-attachments]
    volumes: [clamav-signatures-canary:/var/lib/clamav]
    read_only: true
    tmpfs: [/tmp, /run]
networks:
  canary-model: { internal: true }
  canary-attachments: { internal: true }
volumes:
  seaweedfs-canary: {}
  clamav-signatures-canary: {}
