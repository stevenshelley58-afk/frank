# Third, mandatory production Compose file when the reviewed harness manifest is enabled:
# docker-compose.dev.yml + docker-compose.app.yml + docker-compose.harness.yml.
# No ports are published. The existing SeaweedFS physical volume is reused; this file never
# creates a second object store or attachment volume.
services:
  frank-seaweedfs:
    image: "${FRANK_SEAWEEDFS_CURRENT_IMAGE:?reviewed SeaweedFS digest required}"
    networks: [frank-attachments]
    volumes:
      - type: volume
        source: frank-cell-seaweedfs-data
        target: /data
    expose: ["8333"]
  frank-litellm:
    image: "${FRANK_LITELLM_CURRENT_IMAGE:?reviewed LiteLLM digest required}"
    networks: [frank, frank-model]
    volumes: ["../harness/litellm/config.yaml:/etc/litellm/config.yaml:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["4000"]
  frank-tusd:
    image: "${FRANK_TUSD_CURRENT_IMAGE:?reviewed tusd digest required}"
    command: ["-base-path=/v1/uploads/tus/", "-s3-bucket=frank-attachment-staging", "-max-size=2147483648", "-hooks-http=${FRANK_TUSD_HOOK_URL:?required}", "-hooks-enabled-events=pre-create,pre-terminate,post-finish", "-disable-download", "-disable-concatenation"]
    networks: [frank, frank-attachments]
    environment:
      AWS_ENDPOINT: http://frank-seaweedfs:8333
      AWS_S3_FORCE_PATH_STYLE: "true"
      FRANK_TUSD_HOOK_BEARER: "${FRANK_TUSD_HOOK_BEARER:?required}"
    depends_on: { frank-seaweedfs: { condition: service_started } }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["1080"]
  frank-clamav:
    image: "${FRANK_CLAMAV_CURRENT_IMAGE:?reviewed ClamAV digest required}"
    networks: [frank]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["3310"]
  frank-letta:
    image: "${FRANK_LETTA_CURRENT_IMAGE:?reviewed Letta digest required}"
    networks: [frank]
    expose: ["8283"]
  frank-hermes:
    profiles: [harness-specialist]
    image: "${FRANK_HERMES_CURRENT_IMAGE:?reviewed Hermes digest required}"
    networks: [frank, frank-model]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  frank: { external: true, name: frank }
  frank-model: { internal: true, name: frank-model }
  frank-attachments: { internal: true, name: frank-attachments }
volumes:
  frank-cell-seaweedfs-data: { external: true, name: frank-cell-seaweedfs-data }
