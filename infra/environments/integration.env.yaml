# FRANK environment definition — validates against ./schema.json (schema://frank.environment/v1)
# FRANK-§16.4: "Integration: automated service and connector contracts."
#
# Nothing in this file is stood up during Slice 0.

schema: frank.environment/v1
name: integration
title: Continuous integration and contract verification
status: defined

purpose: >-
  An ephemeral, per-run environment that proves service and connector contracts
  (FRANK-§18.1 contract and integration layers) and produces the signed build artifact,
  SBOM, and provenance that every later environment runs (FRANK-§15.8, FRANK-§21
  Workstream 2). It is the only environment that builds; everything downstream promotes.

specRefs:
  - FRANK-§16.4
  - FRANK-§18.1
  - FRANK-§18.4
  - FRANK-§15.8
  - FRANK-§13.5
  - FRANK-§21

topology:
  boundary: ephemeral-ci-runner
  providerAccount: ci-provider
  dedicatedTelemetryNode: false
  notes: >-
    A fresh runner per pipeline run. FRANK-§21 Workstream 2 requires that a clean machine
    can reproduce builds, so no state may survive between runs — including caches that
    could smuggle an unpinned dependency forward.

services:
  present:
    - domain-api
    - canonical-database
    - durable-workflows
    - object-storage
    - cache
    - event-transport
    - identity
    - agent-evaluation
  optional:
    - web
    - reverse-proxy
    - model-gateway
    - telemetry
    - knowledge-projection
  absent:
    - untrusted-execution
    - preview-hosting
    - collaboration
    - machine-secrets
    - llm-observability
    - metrics
    - logs
    - traces
    - dashboards
    - availability-checks
    - private-access
  notes:
    identity: >-
      A real Authentik-shaped OIDC issuer is required because FRANK-§18.1 lists
      authorization under the security layer; a mocked issuer would make those tests
      vacuous.
    agent-evaluation: >-
      FRANK-§18.2 promotion thresholds are evaluated here against versioned datasets.
      A run that cannot produce these numbers cannot promote.
    model-gateway: >-
      LiteLLM runs against recorded provider responses. Live provider calls are permitted
      only for an explicitly labelled, budgeted eval job, never for ordinary contract runs.
    untrusted-execution: >-
      FRANK-§15.4: agent-written executables need a hardened microVM on the separate
      execution worker. CI runs only trusted first-party jobs whose commit, image, and
      command were signed by protected continuous integration.
    machine-secrets: Credentials arrive as short-lived OIDC-federated tokens; no OpenBao instance exists on a runner.
    collaboration: Buzz has no contract surface that requires a live relay in CI; its adapters are tested against doubles.

dataClassification:
  ceiling: internal
  mayHoldPrivate: false
  mayHoldSensitive: false
  dataOrigin: synthetic-fixtures
  rationale: >-
    Contract fixtures and seeded-defect corpora only. FRANK-§2.3: CI logs, traces, and
    artifacts are widely readable and retained, so admitting `private` data here would
    reclassify the entire pipeline and its artifact store.

network:
  registrableDomain: internal
  hostnames:
    - api.integration.internal
    - auth.integration.internal
  mustNotBeChildOf:
    - frank.fail
  publicDns: false
  adminConsolesPublicDns: false
  edge: None. Services are addressed on the runner's private network.
  egress: allowlist
  notes: >-
    Egress is restricted to the package registry, the artifact registry, and declared
    provider sandbox endpoints. FRANK-§15.8 supply chain: an unpinned or malicious
    dependency fixture must be blocked, which requires the allowlist to be real.

isolation:
  cellId: frank-integration-run
  sharesCredentials: false
  sharesWritableDatabase: false
  isolatedFromProduction:
    - cookies
    - service-workers
    - credentials
    - networks
    - storage
    - identity-audience
  identityAudience: frank-integration
  notes: >-
    The cell identifier is per-run. Two concurrent pipeline runs are two cells and never
    share a writable database (FRANK-§16.4).

traffic:
  acceptsOrdinaryUserTraffic: false
  publicAccess: none
  canonicalWriteAuthority:
    holdsCanonicalData: false
    mayBecomeActiveWriter: false
    requiresFencingOfPriorWriter: false

externalSideEffects:
  allowed: false
  mode: sandboxed-doubles
  rationale: >-
    FRANK-§13.5 suites simulate provider success followed by a dropped response, which
    requires a controllable double rather than a real provider. The duplicate-side-effect
    threshold of FRANK-§18.2 is proven here precisely because nothing real is touched.

secrets:
  source: ci-oidc-short-lived
  shortLivedCredentials: true
  longLivedProviderKeys: none
  notes: >-
    FRANK-§15.3: agents and jobs receive short-lived derived credentials. Signing keys are
    held by the protected release workflow, not by ordinary pull-request runs, so a fork
    or an untrusted contribution cannot produce a signable artifact.

backup:
  posture: ci-artifact-only
  offCell: true
  restoreTested: not-applicable
  retention: >-
    Build artifacts, SBOMs, provenance, and evidence packs are retained in the artifact
    registry with the release history (FRANK-§16.8). The runner itself is not backed up.
  notes: The environment is disposable; the artifact it produces is not.

promotion:
  promotesFrom:
    - source-commit
  promotesTo:
    - preview
    - staging
  artifact:
    builtHere: true
    digestSource: source-commit
    isReleaseEvidenceAnchor: false
    requiresDigestMatchingStagingEvidence: false
    rebuildForbidden: false
  gates:
    - FRANK-§18.1 static layer — formatting, lint, types, schema, dependency direction, secrets, licenses.
    - FRANK-§18.1 unit, contract, and integration layers pass.
    - FRANK-§15.8 supply chain — dependencies locked, scanned, and pinned; malicious or unpinned fixtures blocked.
    - Artifact is signed and carries an SBOM and provenance attestation.
  notes: >-
    This is the only environment where `builtHere` is true. FRANK-§18.4: build once,
    promote the same signed artifact. The digest minted here is the digest that must still
    be present in staging evidence and in the production promotion record (FRANK-§18.2
    "Release identity").

lifetime:
  model: ephemeral-per-run
  disposable: true
  rebuildableFromDefinition: true
  notes: Created at pipeline start, destroyed at pipeline end, whether the run passed or failed.

destruction:
  triggers:
    - Pipeline run completion
    - Pipeline run cancellation or timeout
  method: Runner and all attached volumes are discarded by the CI provider.
  evidence:
    - Run identifier, commit, and artifact digest recorded in the release history.
    - Short-lived credentials expire without a revocation step; expiry is the evidence.
  preserved:
    - Signed build artifact, SBOM, provenance, and test/eval evidence in the artifact registry.
  blockedWhile:
    - Evidence upload for the run has not completed.

resources:
  profile: ephemeral-ci-runner
  concurrency:
    maxHeavyBuilds: 2
    maxLightJobs: 6
  notes: >-
    Concurrency mirrors the FRANK-§16.6 execution-worker admission limit rather than
    inventing a second number, and is revisited only after a load test.
