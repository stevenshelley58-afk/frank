# FRANK environment definition — validates against ./schema.json (schema://frank.environment/v1)
# FRANK-§16.4: "Staging: production-shaped release rehearsal and migration verification."
# FRANK-§18.2 "Release identity": one artifact digest from staging evidence through
# production promotion. Staging is the anchor of that chain.
#
# Nothing in this file is stood up during Slice 0. This definition is not a stub
# (Slice 0 exit gate 7).

schema: frank.environment/v1
name: staging
title: Production-shaped release rehearsal
status: defined

purpose: >-
  A production-shaped cell where a release is rehearsed end to end before promotion:
  expand/contract migrations, connector cutovers, edge and TLS behaviour, recovery
  procedures, and the FRANK-§18.3 release-gate evidence. It is the environment whose
  evidence pack carries the artifact digest that production promotion must match, and it is
  the disposable production-shaped cell used for the FRANK-§16.7 monthly failover exercise.

specRefs:
  - FRANK-§16.4
  - FRANK-§18.2
  - FRANK-§18.3
  - FRANK-§18.4
  - FRANK-§16.7
  - FRANK-§16.6
  - FRANK-§16.3
  - FRANK-§2.3

topology:
  boundary: control-plane-cell
  providerAccount: vps-provider
  dedicatedTelemetryNode: false
  notes: >-
    A separate host from production with its own volumes, databases, credentials, queues,
    object prefixes, identity clients, Buzz relay, and preview domain — the same separation
    FRANK-§16.3.1 step 4 requires when building a new cell alongside an existing one.
    Production-shaped means the same service set and the same edge behaviour, not the same
    machine and never the same data.

services:
  present:
    - reverse-proxy
    - web
    - domain-api
    - durable-workflows
    - canonical-database
    - object-storage
    - cache
    - event-transport
    - model-gateway
    - collaboration
    - knowledge-projection
    - identity
    - machine-secrets
    - telemetry
    - metrics
    - logs
    - traces
    - dashboards
    - private-access
  optional:
    - untrusted-execution
    - llm-observability
    - agent-evaluation
    - availability-checks
  absent:
    - preview-hosting
  notes:
    preview-hosting: >-
      Owned by the `preview` environment on the separate worker and registrable domain
      (FRANK-§16.3). A staging-hosted preview would put untrusted output back inside a
      `frank.fail` cookie scope.
    untrusted-execution: >-
      A scaled-down execution worker is attached only when a release changes sandbox,
      egress-proxy, or microVM behaviour, so that FRANK-§15.4 containment is rehearsed
      rather than assumed. It is never colocated with the staging control plane.
    machine-secrets: >-
      A separate OpenBao instance with its own secret root and its own KMS key. Sharing the
      production root would breach FRANK-§16.4 and would make a staging compromise a
      production compromise.
    collaboration: >-
      A separate Buzz relay. FRANK-§16.7 lists Buzz as a per-store recovery objective, so
      its restore must be rehearsed somewhere that is not production.
    llm-observability: >-
      FRANK-§16.6: Langfuse is not admitted to the control VPS and needs a dedicated,
      load-tested telemetry node. Enabled in staging only to rehearse that node.
    identity: A distinct Authentik realm and audience; no production identity client is reused.

dataClassification:
  ceiling: internal
  mayHoldPrivate: false
  mayHoldSensitive: false
  dataOrigin: sanitized-synthetic
  rationale: >-
    FRANK-§16.4 does not state a data rule for staging — a genuine gap, resolved here in the
    restrictive direction. Staging is seeded with production-shaped synthetic corpora built
    to match production's volume, cardinality, and distribution, which is what migration and
    performance rehearsal actually requires; it is never seeded from a production restore.
    FRANK-§2.3 forces this: a restored production dataset would carry `sensitive`, and every
    staging log, trace, embedding, artifact, and Buzz projection would inherit it, obliging
    staging to meet production's controls, retention, and compartment rules in full. Testing
    a restore of real production data is the job of the `recovery` environment, which is
    already built to hold it. Restore rehearsal in staging uses staging's own backups.

network:
  registrableDomain: frank.fail
  hostnames:
    - staging.frank.fail
    - api.staging.frank.fail
    - auth.staging.frank.fail
    - rooms.staging.frank.fail
    - hooks.staging.frank.fail
    - status.staging.frank.fail
  publicDns: true
  adminConsolesPublicDns: false
  edge: Caddy with automatic TLS, the production secure-header set, and rate limits
  egress: allowlist
  notes: >-
    FRANK-§16.3's domain map covers production and previews but names no staging hostnames —
    another gap filled here. Staging mirrors the map under a `staging.` label on `frank.fail`
    because rehearsing real ACME issuance, HSTS, secure-header, and cross-subdomain cookie
    behaviour requires a genuine public name. That co-location is acceptable precisely
    because staging holds no untrusted execution and no owner data; previews, which do run
    untrusted code, stay off `frank.fail` entirely. Every route requires authentication and
    indexing is refused, so a public DNS record is not public access. Admin consoles remain
    private-network only per FRANK-§16.3.

isolation:
  cellId: frank-staging
  sharesCredentials: false
  sharesWritableDatabase: false
  isolatedFromProduction:
    - cookies
    - service-workers
    - credentials
    - networks
    - storage
    - identity-audience
  identityAudience: frank-staging
  notes: >-
    FRANK-§16.4: no environment shares credentials or writable databases with another.
    Staging cookies are scoped to `staging.frank.fail` and the identity audience differs, so
    a staging session cannot be replayed against production.

traffic:
  acceptsOrdinaryUserTraffic: false
  publicAccess: authenticated-only
  canonicalWriteAuthority:
    holdsCanonicalData: false
    mayBecomeActiveWriter: false
    requiresFencingOfPriorWriter: false
  notes: >-
    Operators and release rehearsal only. Synthetic authenticated journeys run here as a
    dress rehearsal for the FRANK-§19.3 production probes.

externalSideEffects:
  allowed: false
  mode: contained
  rationale: >-
    Production is the only environment permitted real external side effects (FRANK-§16.4).
    Staging rehearses the full FRANK-§13.5 lifecycle — prepared, attempted, observed,
    outcome_unknown, reconciled — against provider sandboxes and a mail sink, so duplicate
    side effects, dropped responses, and webhook redelivery are proven before promotion
    without a real message, payment, invitation, or publication ever leaving the cell.

secrets:
  source: openbao
  shortLivedCredentials: true
  longLivedProviderKeys: scoped-broker-injected
  unsealPath: >-
    Dedicated staging KMS key in the independent recovery provider account, separate from
    the production key (FRANK-§15.3).
  notes: >-
    FRANK-§15.3 requires every restart, upgrade, and full-cell restore to prove ordinary
    auto-unseal, replacement-host restore, temporary KMS outage, revoked bootstrap
    credentials, audit-device continuity, policy restoration, and token revocation. Staging
    is where those drills run against a real OpenBao before they are trusted in production.

backup:
  posture: pre-change-snapshot
  offCell: true
  restoreTested: per-release-rehearsal
  retention: >-
    Snapshots retained for the duration of the release train plus 14 days, matching the
    FRANK-§16.8 point-in-time recovery window so a rehearsed rollback exercises a real
    retention boundary.
  recoveryPointMinutes: 60
  notes: >-
    Staging backups exist to make migration rollback rehearsable, not to protect data —
    there is no data here worth protecting. A rehearsal that cannot restore its own
    pre-migration snapshot has not proven the FRANK-§18.3 rollback requirement.

promotion:
  promotesFrom:
    - integration
    - preview
  promotesTo:
    - production
  artifact:
    builtHere: false
    digestSource: integration
    isReleaseEvidenceAnchor: true
    requiresDigestMatchingStagingEvidence: false
    rebuildForbidden: true
  gates:
    - Signed integration artifact with SBOM and provenance exists (FRANK-§15.8).
    - FRANK-§18.3 — preview journeys pass.
    - FRANK-§18.2 promotion thresholds met, including zero duplicate irreversible side effects.
  notes: >-
    FRANK-§18.2 "Release identity" requires one artifact digest from staging evidence
    through production promotion. Staging is the anchor of that chain: it does not build,
    it may not rebuild, and the digest recorded in its immutable evidence pack is the exact
    value production promotion is checked against. The artifact arrives from `integration`;
    `preview` also appears in `promotesFrom` because a change reaches staging only after its
    preview journeys pass (FRANK-§18.3) — preview contributes evidence, never a new digest.
    If staging ever rebuilt an image, the
    release-identity threshold would become unverifiable — every downstream signature would
    attest to an artifact no evidence pack had actually exercised. Exactly one environment
    may set `isReleaseEvidenceAnchor`, and the validator enforces that it is this one.

lifetime:
  model: permanent
  disposable: false
  rebuildableFromDefinition: true
  notes: >-
    Standing rather than disposable, because release rehearsal must be available on demand
    and its own history of rehearsals is useful. It is nonetheless fully rebuildable from
    this definition — FRANK-§16.7 uses "a disposable production-shaped cell" for the monthly
    failover exercise, and staging is that cell: it is fenced, failed over to the warm
    recovery path, measured against the 15-minute objective, and restored.

destruction:
  triggers:
    - Owner decision to rebuild the staging cell
    - Completion of a destructive recovery exercise that rebuilt the cell
    - Retirement of a release train that required a distinct staging shape
  method: >-
    Recorded inventory first, then destruction of the exact hosts, volumes, databases,
    buckets, credentials, DNS records, certificates, and identity clients belonging to the
    staging cell — the FRANK-§16.3.1 discipline applied to a non-production cell.
  evidence:
    - Signed inventory taken before destruction (FRANK-§16.3.1 step 3).
    - Destruction manifest of every removed resource identifier and provider receipt (step 12).
    - Revoked staging credentials and the retired staging KMS key reference.
  preserved:
    - Release evidence packs and artifact digests, which live with the release history, not with the cell.
  blockedWhile:
    - A release is in flight whose production promotion has not yet been recorded.
    - The staging evidence pack for the current release train has not been made immutable.

resources:
  profile: reference-control-vps
  vcpu: 8
  memoryGb: 64
  diskGb: 400
  osReserve:
    memoryGb: 8
    cpuPercent: 15
  memoryEnvelopesGb:
    postgresql: 8
    workflowEventCache: 5
    webApi: 4
    identitySecretsEdge: 3
    buzz: 4
    objectServices: 2
    modelMemoryServices: 6
    observability: 6
    controlPlaneWorkers: 8
    uncommittedReserve: 10
  diskQuotasGb:
    canonicalDatabase: 80
    objects: 180
    logsTraces: 30
    buzz: 25
    workflowEventStores: 25
    imagesCaches: 20
    emergencyReserve: 40
  lifecycleThresholdsPercent:
    alert: 65
    throttle: 75
    contain: 85
  notes: >-
    Staging carries the identical FRANK-§16.6 envelopes and quotas as production. A
    smaller staging box would make migration timing, OOM priority, and disk-lifecycle
    behaviour unrepresentative, and FRANK-§16.6 already forbids OOM-eviction of PostgreSQL,
    identity, workflow, and secret services — a rule that can only be rehearsed at the real
    envelope. Deployment discovery still records the actual host before provisioning.
