# FRANK environment definition — validates against ./schema.json (schema://frank.environment/v1)
# FRANK-§16.4: "Preview: one expiring environment per change, sanitized data only."
#
# Nothing in this file is stood up during Slice 0.

schema: frank.environment/v1
name: preview
title: Expiring per-change preview
status: defined

purpose: >-
  One expiring environment per change, hosted on the separate execution and preview worker,
  so a change can be reviewed as a running system before it reaches staging. A preview is
  treated as hostile by construction: it may run agent-written code, so it is placed on a
  different registrable domain, a different network, and a different identity audience from
  production (FRANK-§16.3, FRANK-§16.2, FRANK-§15.4).

specRefs:
  - FRANK-§16.4
  - FRANK-§16.3
  - FRANK-§16.2
  - FRANK-§16.1
  - FRANK-§15.4
  - FRANK-§16.8
  - FRANK-§21

topology:
  boundary: execution-and-preview-worker
  providerAccount: sandbox-provider
  dedicatedTelemetryNode: false
  notes: >-
    FRANK-§16.1 places the hardened microVM pool, the isolated preview host, and the policy
    egress proxy on a separate execution worker with no control-plane network. FRANK-§16.6
    is explicit that the control VPS runs no untrusted build microVM.

services:
  present:
    - reverse-proxy
    - web
    - domain-api
    - canonical-database
    - object-storage
    - cache
    - preview-hosting
    - untrusted-execution
    - identity
  optional:
    - durable-workflows
    - event-transport
    - model-gateway
    - telemetry
    - availability-checks
  absent:
    - collaboration
    - knowledge-projection
    - machine-secrets
    - llm-observability
    - agent-evaluation
    - metrics
    - logs
    - traces
    - dashboards
    - private-access
  notes:
    canonical-database: >-
      A separate, writable, synthetic-seeded database per preview. FRANK-§16.4 forbids
      sharing a writable database with any other environment, so a preview never attaches
      to staging or production storage even read-only.
    identity: >-
      Expiring preview auth on a distinct audience (FRANK-§16.2, FRANK-§16.3). A production
      session token presented to a preview is not merely rejected — it is not addressable,
      because the cookie scope and audience differ.
    collaboration: >-
      No Buzz relay. FRANK-§16.2 gives Steven one private relay; projecting preview content
      into it would put untrusted output on a production surface.
    untrusted-execution: >-
      The hardened microVM pool that builds and runs the change. Egress passes the policy
      proxy; there is no route to the control plane.
    private-access: >-
      Previews are reviewed over the public preview domain with expiring auth, not over the
      operator overlay. Putting the sandbox worker on the operator network would defeat the
      network isolation FRANK-§16.3 requires.
    durable-workflows: >-
      Present only when the change under review touches workflow behaviour, and then in
      contained mode with no external side effects.

dataClassification:
  ceiling: internal
  mayHoldPrivate: false
  mayHoldSensitive: false
  dataOrigin: synthetic-fixtures
  rationale: >-
    FRANK-§16.4 says sanitized data only and FRANK-§16.2 says synthetic data; this
    definition resolves the two by permitting synthetic fixtures exclusively. Sanitization
    of real owner records is a redaction, and FRANK-§2.3 only lowers a class through an
    explicit deterministic redaction producing a separately verified artifact. No such
    verified pipeline exists, so the safe reading — synthetic only — is the binding one.

network:
  registrableDomain: SANDBOX_BASE_DOMAIN
  hostnames:
    - "*.preview.SANDBOX_BASE_DOMAIN"
  mustNotBeChildOf:
    - frank.fail
  publicDns: true
  adminConsolesPublicDns: false
  edge: Caddy on the preview worker with strict CSP and sandbox headers
  egress: policy-proxy-default-deny
  notes: >-
    FRANK-§16.3: `SANDBOX_BASE_DOMAIN` must be a separately owned registrable domain and
    never a child of `frank.fail`. This is a browser-security boundary, not a naming
    preference — a `preview.frank.fail` name would share the eTLD+1 with production and
    make cookie, storage, and service-worker isolation depend on flags rather than on the
    same-site model. The placeholder is left unresolved here so no later edit can quietly
    substitute a `frank.fail` child; the validator rejects that substitution.

isolation:
  cellId: frank-preview-change
  sharesCredentials: false
  sharesWritableDatabase: false
  isolatedFromProduction:
    - cookies
    - service-workers
    - credentials
    - networks
    - storage
    - identity-audience
  identityAudience: frank-preview
  notes: >-
    All six isolation axes named in FRANK-§16.3 are asserted here and checked by the
    validator. The cell identifier is per-change, so two concurrent previews are two cells.

traffic:
  acceptsOrdinaryUserTraffic: false
  publicAccess: authenticated-only
  canonicalWriteAuthority:
    holdsCanonicalData: false
    mayBecomeActiveWriter: false
    requiresFencingOfPriorWriter: false
  notes: >-
    Reachable publicly by DNS but only usable with expiring preview credentials. Reviewers,
    not users. Search indexing is refused at the edge.

externalSideEffects:
  allowed: false
  mode: contained
  rationale: >-
    A preview may execute agent-written code (FRANK-§15.4), so the egress proxy is
    default-deny with DNS, destination, protocol, and byte controls. Connector commands
    resolve to doubles. This is the environment where a prompt-injection payload is most
    likely to try to reach a real provider, and the containment must hold without relying
    on application-level checks.

secrets:
  source: preview-issuer-expiring
  shortLivedCredentials: true
  longLivedProviderKeys: none
  notes: >-
    FRANK-§15.4: no Docker socket, host root filesystem, SSH agent, or all-purpose cloud
    credential inside an ordinary sandbox. Each job receives a per-job identity, and the
    preview holds no cell credential of any kind.

backup:
  posture: none-disposable
  offCell: false
  restoreTested: not-applicable
  retention: >-
    None. FRANK-§16.8 retains expiring previews for 14 days as a live environment, not as a
    restorable copy. Review evidence is retained with the change pack, not with the preview.
  notes: A preview that needs restoring should be recreated from its pinned artifact digest instead.

promotion:
  promotesFrom:
    - integration
  promotesTo:
    - staging
  artifact:
    builtHere: false
    digestSource: integration
    isReleaseEvidenceAnchor: false
    requiresDigestMatchingStagingEvidence: false
    rebuildForbidden: true
  gates:
    - The change has a signed integration artifact; a preview is never built from a working tree.
    - FRANK-§18.3 — preview journeys pass before the change moves to staging.
  notes: >-
    A preview runs the same digest integration produced, which is what makes a passing
    preview journey evidence about the release rather than about a one-off build.

lifetime:
  model: ephemeral-per-change
  disposable: true
  rebuildableFromDefinition: true
  expiry:
    ttlDays: 14
    extendable: true
    extensionAuthority: Explicit retention from Review (FRANK-§16.8)
    maxTtlDays: 90
  notes: >-
    FRANK-§16.8: expiring previews live 14 days unless retained from Review. The 90-day
    ceiling aligns an extended preview with the retention of the rejected branch or change
    pack it belongs to, so a retained preview cannot outlive its own change record.

destruction:
  triggers:
    - Time-to-live expiry
    - Change merged, superseded, or abandoned
    - Failed or discarded build sandbox — destroyed within 48 hours after evidence collection (FRANK-§16.8)
    - Containment action against the preview worker
  method: >-
    Preview host, microVM workspace, per-preview database, object prefix, DNS record, and
    per-job identity are destroyed together. Expiry is enforced by the provisioner, not by
    an operator remembering.
  evidence:
    - Preview identifier, artifact digest, and expiry timestamp recorded on the change pack.
    - Destroyed resource identifiers and provider receipts (FRANK-§16.3.1 step 12).
    - Revoked per-job identities and expired preview credentials.
  preserved:
    - Review findings, journey results, and screenshots attached to the change pack.
  blockedWhile:
    - Evidence collection for a failed sandbox is still in progress.
    - An active Review retention is recorded and has not lapsed.

resources:
  profile: execution-and-preview-worker
  concurrency:
    maxHeavyBuilds: 2
    maxLightJobs: 6
  lifecycleThresholdsPercent:
    alert: 65
    throttle: 75
    contain: 85
  notes: >-
    FRANK-§16.6: the separate execution worker sets its own CPU, RAM, and disk quota and
    admits at most two heavy builds or six light jobs until load tests justify more.
    Absolute CPU, memory, and disk are deliberately unset — FRANK-§16.6 fixes a reference
    profile only for the control VPS, and deployment discovery must record the actual
    worker host before provisioning.
