# FRANK environment definition — validates against ./schema.json (schema://frank.environment/v1)
# FRANK-§16.4: "Local: reproducible developer stack with synthetic fixtures."
#
# Nothing in this file is stood up during Slice 0. It is the authority that a
# later Slice must satisfy, not a description of a running system.

schema: frank.environment/v1
name: local
title: Local developer stack
status: defined

purpose: >-
  A reproducible developer stack on Steven's own machine, seeded entirely from synthetic
  fixtures. It exists so that domain and contract work can be done without a network path
  to owner data, and so that a clean machine can reproduce a build (FRANK-§21 Workstream 2
  verification). It is never an authority for anything and holds no record that matters.

specRefs:
  - FRANK-§16.4
  - FRANK-§16.2
  - FRANK-§15.3
  - FRANK-§17.3
  - FRANK-§2.3

topology:
  boundary: developer-workstation
  providerAccount: developer-owned
  dedicatedTelemetryNode: false
  notes: >-
    Docker Compose on the developer's machine (FRANK-§16.1 names Compose as the preferred
    package for a stable service node). No connection to the control VPS, the execution
    worker, or the recovery account exists or is configured.

services:
  present:
    - reverse-proxy
    - web
    - domain-api
    - durable-workflows
    - canonical-database
    - object-storage
    - cache
    - event-transport
    - identity
  optional:
    - model-gateway
    - knowledge-projection
    - telemetry
    - agent-evaluation
    - collaboration
    - metrics
  absent:
    - untrusted-execution
    - preview-hosting
    - machine-secrets
    - llm-observability
    - logs
    - traces
    - dashboards
    - availability-checks
    - private-access
  notes:
    untrusted-execution: >-
      FRANK-§15.4: untrusted repositories and agent-written executables run in a hardened
      microVM on a separate execution worker, never on a developer kernel. Absent here means
      such work queues; it never falls back to direct execution.
    preview-hosting: Previews are owned by the `preview` environment on a separate registrable domain (FRANK-§16.3).
    machine-secrets: >-
      FRANK-§15.3: OpenBao is a cell service. Local uses the age/SOPS bootstrap path instead,
      so a developer machine never holds an unseal path or a KMS grant.
    model-gateway: >-
      LiteLLM may run locally against recorded fixtures or a local model. Any real provider
      route from a developer machine is a personal credential, never a cell credential.
    identity: Local OIDC issuer with a distinct audience; passkeys are exercised, sessions are throwaway.
    llm-observability: FRANK-§16.6 — Langfuse requires a separately sized node and is never a developer dependency.

dataClassification:
  ceiling: internal
  mayHoldPrivate: false
  mayHoldSensitive: false
  dataOrigin: synthetic-fixtures
  rationale: >-
    FRANK-§16.4 specifies synthetic fixtures. FRANK-§2.3 makes this binding rather than
    advisory: a derived artifact retains the strictest contributing class, so a single
    real email imported here would raise the whole workstation to `private` and drag every
    trace, embedding, and log on the machine with it.

network:
  registrableDomain: localhost
  hostnames:
    - frank.localhost
    - api.frank.localhost
    - auth.frank.localhost
    - rooms.frank.localhost
    - hooks.frank.localhost
    - status.frank.localhost
  mustNotBeChildOf:
    - frank.fail
  publicDns: false
  adminConsolesPublicDns: false
  edge: Caddy with a locally trusted internal certificate authority
  egress: unrestricted-developer
  notes: >-
    The FRANK-§16.3 domain map is mirrored onto `.localhost` so route, cookie-scope, and
    cross-subdomain behaviour are exercised in the same shape as production. `localhost` is
    not a registrable domain; it is recorded here because the field must state where the
    names actually live.

isolation:
  cellId: frank-local-dev
  sharesCredentials: false
  sharesWritableDatabase: false
  isolatedFromProduction:
    - cookies
    - service-workers
    - credentials
    - networks
    - storage
    - identity-audience
  identityAudience: frank-local
  notes: >-
    FRANK-§16.4: no environment shares credentials or writable databases with another.
    A developer machine holds no production credential and has no route that could reach
    a production writable store.

traffic:
  acceptsOrdinaryUserTraffic: false
  publicAccess: private-network-only
  canonicalWriteAuthority:
    holdsCanonicalData: false
    mayBecomeActiveWriter: false
    requiresFencingOfPriorWriter: false
  notes: Loopback only. No listener is bound to a routable interface.

externalSideEffects:
  allowed: false
  mode: sandboxed-doubles
  rationale: >-
    FRANK-§13.5 connector commands run against recorded doubles or provider sandboxes.
    Outbound mail goes to a local sink. Production is the only environment permitted real
    external side effects, so a local run can never send, publish, pay, or invite.

secrets:
  source: sops-age-encrypted-file
  shortLivedCredentials: false
  longLivedProviderKeys: none
  notes: >-
    FRANK-§15.3: bootstrap configuration is encrypted with age/SOPS. FRANK-§17.2:
    infrastructure code contains no secrets. Secret scans run before every push.

backup:
  posture: none-disposable
  offCell: false
  restoreTested: not-applicable
  retention: None. Fixtures are regenerated from the repository, never restored.
  notes: >-
    If losing a local stack loses work, the work was not committed. That is a developer
    error, not a backup requirement.

promotion:
  promotesFrom:
    - working-tree
  promotesTo: []
  artifact:
    builtHere: false
    digestSource: working-tree
    isReleaseEvidenceAnchor: false
    requiresDigestMatchingStagingEvidence: false
    rebuildForbidden: false
  gates:
    - Nothing is promoted into local; it is built from the working tree on demand.
  notes: >-
    Local images are unsigned developer builds and carry no release identity. FRANK-§18.4
    ("build once; promote the same signed artifact") begins at `integration`, so no local
    build digest may ever appear downstream. `promotesTo` is empty on purpose: nothing is
    promoted out of a developer machine. What advances is a signed source commit, which
    enters `integration` on its own authority and is rebuilt there from scratch.

lifetime:
  model: on-demand
  disposable: true
  rebuildableFromDefinition: true
  notes: Torn down and recreated freely; a stale local stack is destroyed rather than repaired.

destruction:
  triggers:
    - Developer request
    - Fixture or schema regeneration
    - End of a work session
  method: >-
    `docker compose down --volumes` plus removal of the local object-storage and fixture
    directories. No provider resources exist to release.
  evidence:
    - None required; no canonical, audited, or owner-visible record exists here.
  preserved: []
  blockedWhile:
    - Uncommitted work exists in the repository working tree.

resources:
  profile: developer-machine
  notes: >-
    FRANK-§16.6 requires measurement before sizing. The local stack is sized by whatever the
    developer machine has; the control-VPS envelopes in FRANK-§16.6 are deliberately not
    replicated here, because a local machine that happened to meet them would still prove
    nothing about the real host.
