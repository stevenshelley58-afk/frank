# FRANK environment definition — validates against ./schema.json (schema://frank.environment/v1)
# FRANK-§16.4: "Recovery: isolated restoration target with no outbound side effects."
# FRANK-§16.1: the warm recovery cell — pre-provisioned, admitting no ordinary user traffic
# until the failover controller verifies fencing of the old writer.
#
# Nothing in this file is stood up during Slice 0. This definition is not a stub
# (Slice 0 exit gate 7).

schema: frank.environment/v1
name: recovery
title: Warm recovery cell
status: defined

purpose: >-
  The pre-provisioned warm standby in an independent provider account. It exists so that
  core read and durable capture can be fenced over within 15 minutes of a qualifying host
  failure, and so that monthly isolated restores and quarterly full-cell rebuilds have a
  real target. It is also the only environment other than production that may legitimately
  hold restored owner data, which is why it must meet production's controls rather than
  test-environment controls.

specRefs:
  - FRANK-§16.4
  - FRANK-§16.1
  - FRANK-§16.7
  - FRANK-§15.3
  - FRANK-§19.3
  - FRANK-§2.3
  - FRANK-§21

topology:
  boundary: warm-recovery-cell
  providerAccount: independent-recovery-provider
  dedicatedTelemetryNode: false
  notes: >-
    FRANK-§16.1 places the warm recovery cell, KMS, backup destination, and DNS failover
    path in a provider account independent of the VPS. Independence is the entire point: a
    recovery cell inside the production provider account does not survive the failure modes
    it exists for — account compromise, billing suspension, or a provider-wide outage.

services:
  present:
    - reverse-proxy
    - web
    - domain-api
    - durable-workflows
    - canonical-database
    - object-storage
    - cache
    - event-transport
    - identity
    - machine-secrets
    - collaboration
    - telemetry
    - availability-checks
    - private-access
  optional:
    - knowledge-projection
    - model-gateway
    - metrics
    - logs
    - traces
    - dashboards
  absent:
    - preview-hosting
    - untrusted-execution
    - llm-observability
    - agent-evaluation
  notes:
    canonical-database: >-
      Encrypted PostgreSQL standby or continuously restored replica (FRANK-§16.1). Target:
      warm writer attach within 10 minutes, clean restore within 30 (FRANK-§16.7). It is a
      reader until fencing completes.
    object-storage: Replicated core object working set; warm within 15 minutes, clean restore within 45.
    durable-workflows: >-
      Pre-provisioned but started in contained mode. FRANK-§16.7 bootstrap order places
      workflow after audit verification, and outbound side effects remain disabled until
      invocation-ledger reconciliation is clean. Target: contained resume within 45 minutes.
    machine-secrets: >-
      OpenBao recovery path with the deletion-protected KMS key and Steven's offline
      threshold material. FRANK-§15.3 requires the recovery plan to cover loss of either
      dependency, so the shares do not replace the KMS key.
    availability-checks: >-
      Synthetic read and capture probes run continuously against the warm cell
      (FRANK-§16.1), because a warm standby that is only tested at failover is not warm.
    untrusted-execution: >-
      Never. FRANK-§16.4 requires no outbound side effects, and agent-written code in a
      recovery cell holding restored owner data is the exact combination the isolation
      rules exist to prevent.
    preview-hosting: Not applicable; previews are disposable and are not part of a recovery objective.
    agent-evaluation: Evals are a promotion gate, not a recovery capability; they never run against restored owner data.
    model-gateway: >-
      Optional and disabled until reconciliation is clean. FRANK-§16.7 places model and
      harness workers late in the bootstrap order, after connectors.
    collaboration: >-
      Buzz is a per-store recovery objective in FRANK-§16.7 with a 45-minute restore
      target, so a Buzz relay is part of the warm cell.

dataClassification:
  ceiling: sensitive
  mayHoldPrivate: true
  mayHoldSensitive: true
  dataOrigin: restored-production-backup
  rationale: >-
    A restored production backup carries production's classification unchanged: FRANK-§2.3
    is explicit that combining or deriving data inherits the strictest contributing class.
    The recovery cell therefore holds `private` and `sensitive` data and must meet
    production-grade controls — encryption, identity, audit, retention, and compartment
    scoping — even though it serves no ordinary traffic. Treating a restore target as a
    "test" environment is the standard way sensitive data escapes, and this definition
    forecloses it.

network:
  registrableDomain: frank.fail
  hostnames:
    - frank.fail
    - api.frank.fail
    - auth.frank.fail
    - rooms.frank.fail
    - hooks.frank.fail
    - status.frank.fail
    - recovery.frank.fail
  publicDns: true
  adminConsolesPublicDns: false
  edge: Pre-provisioned Caddy with certificates and secure headers already issued and renewing
  egress: policy-proxy-default-deny
  notes: >-
    FRANK-§16.1 requires a pre-provisioned network, edge, and DNS failover path. The cell is
    configured to serve the production FRANK-§16.3 names, but DNS does not point at it under
    normal operation; `recovery.frank.fail` is the standing probe name that lets the warm
    path be verified without moving the production records. FRANK-§16.3.1 step 6 reduces
    relevant TTLs to 300 seconds before any planned cutover. Egress stays default-deny so a
    resumed workflow cannot reach a provider before reconciliation clears it.

isolation:
  cellId: frank-recovery
  sharesCredentials: false
  sharesWritableDatabase: false
  isolatedFromProduction:
    - credentials
    - networks
  identityAudience: frank-production
  notes: >-
    FRANK-§16.4: no environment shares credentials or writable databases with another. The
    recovery cell uses independent recovery credentials — FRANK-§16.7 makes them the first
    step of the bootstrap order, precisely so recovery does not depend on the compromised or
    unavailable cell. It shares no writable database: the standby is a reader until fencing
    completes, at which point it becomes the sole writer and production is fenced out.
    Cookies, service workers, storage, and identity audience are deliberately NOT isolated —
    after failover this cell must serve the same `frank.fail` names to the same authenticated
    sessions, so isolating those axes would break the failover it exists to perform. That is
    the opposite of the preview case, where all six axes are isolated.

traffic:
  acceptsOrdinaryUserTraffic: false
  publicAccess: none
  admissionPreconditions:
    - old-writer-fenced
    - recovery-manifest-consistent
    - audit-roots-verified
    - single-active-write-authority
  canonicalWriteAuthority:
    holdsCanonicalData: true
    mayBecomeActiveWriter: true
    requiresFencingOfPriorWriter: true
  notes: >-
    FRANK-§16.1: the cell accepts no ordinary user traffic until the failover controller has
    verified fencing of the old writer, recovery-manifest consistency, audit roots, and a
    single active write authority. All four are mandatory and none may be waived by an
    operator in a hurry — the failure this guards against is a split-brain writer, which
    backups cannot repair. Only operator access over the private overlay and the synthetic
    read/capture probes reach the cell before admission. FRANK-§19.3 measures failover from
    synthetic failure detection to a successful authenticated read and durable capture on
    the fenced warm cell, targeting 15 minutes.

externalSideEffects:
  allowed: false
  mode: contained-until-reconciled
  rationale: >-
    FRANK-§16.4 requires an isolated restoration target with no outbound side effects, and
    FRANK-§16.7 keeps outbound side effects disabled until invocation-ledger reconciliation
    is clean. A restored Temporal history contains workflows mid-flight whose external
    calls may already have succeeded; resuming them with egress open would re-send mail,
    re-issue payments, and re-publish content. Containment is what makes "no duplicated
    external action" in the monthly exercise achievable rather than hoped for.

secrets:
  source: openbao-recovery-path
  shortLivedCredentials: true
  longLivedProviderKeys: scoped-broker-injected
  unsealPath: >-
    The deletion-protected per-cell KMS key held in this same independent account, plus
    Steven's offline threshold recovery shares split across separate physical or
    password-manager locations (FRANK-§15.3).
  notes: >-
    FRANK-§16.7 bootstrap order begins with independent recovery credentials, then the
    network and DNS private path, then secret unseal. FRANK-§15.3 requires the recovery plan
    to cover loss of either the KMS key or the offline shares, and every full-cell restore
    must prove auto-unseal, replacement-host restore, temporary KMS outage, revoked
    bootstrap credentials, audit-device continuity, policy restoration, and token revocation.

backup:
  posture: restore-target
  offCell: true
  restoreTested: quarterly-full-cell-exercise
  retention: >-
    The cell holds the restored working set, not the backup archive. The backups themselves
    live in the encrypted off-provider destination under the FRANK-§16.8 schedule — 14-day
    point-in-time, 35-day daily, 12-week weekly, 24-month monthly.
  recoveryPointMinutes: 5
  notes: >-
    This environment is the destination of production's protection, so it must never become
    the only copy: FRANK-§16.7 keeps the encrypted off-provider backup independent of the
    warm cell. The monthly exercise fences a disposable production-shaped cell over to this
    warm path and measures the 15-minute objective; the quarterly exercise destroys the
    source cell and rebuilds it within the full target. A signed recovery manifest records
    consistent PostgreSQL LSNs, object manifest root, Temporal namespace point, identity and
    secret snapshot IDs, Buzz position, audit-chain root, configuration commit, image
    digests, and decryption-key references.

promotion:
  promotesFrom:
    - production
  promotesTo:
    - production
  artifact:
    builtHere: false
    digestSource: staging
    isReleaseEvidenceAnchor: false
    requiresDigestMatchingStagingEvidence: true
    rebuildForbidden: true
  gates:
    - FRANK-§16.1 — signed release images for the currently promoted production version are pre-staged here.
    - The pre-staged digest matches the digest recorded in staging evidence and promoted to production (FRANK-§18.2).
    - A signed recovery manifest exists and is consistent (FRANK-§16.7).
  notes: >-
    Two different flows share this block and should not be confused. What promotes INTO the
    cell is production's state — replicated data plus the signed release images of the
    running version — so the digest chain reaches recovery unchanged: integration builds it,
    staging anchors the evidence, production promotes it, recovery pre-stages the identical
    value. Failing over onto a different image would mean recovering onto software no
    evidence pack ever exercised. What promotes OUT is the failback path: after fencing,
    reconciliation, and a clean invocation ledger, canonical state is repatriated to a
    rebuilt production cell. That is a state handover, not an artifact promotion, and it
    carries its own single-active-write-authority check in the opposite direction.

lifetime:
  model: standing-warm
  disposable: true
  rebuildableFromDefinition: true
  notes: >-
    Standing and disposable are both true and neither is a contradiction. FRANK-§16.1
    requires the cell to be pre-provisioned and continuously warm; FRANK-§21 Workstream 2
    requires it to be disposable. It is destroyed and rebuilt from this definition plus
    backups during the quarterly exercise, and any rebuild that cannot be performed from the
    definition alone means the definition has drifted from the running cell.

destruction:
  triggers:
    - Quarterly full-cell recovery exercise rebuild (FRANK-§16.7)
    - Rotation of the independent recovery provider account or its KMS key
    - Completed failback, once a rebuilt production cell is the confirmed single active write authority
  method: >-
    Fence, verify write authority elsewhere, then destroy the cell's hosts, volumes,
    databases, buckets, DNS records, certificates, identity configuration, and credentials
    under the FRANK-§16.3.1 discipline. The KMS key is deletion-protected and is retired
    through an explicit seal migration, never as part of a routine teardown.
  evidence:
    - Signed recovery manifest for the last verified warm state, retained before teardown.
    - Destruction manifest of every removed resource ID and provider receipt (FRANK-§16.3.1 step 12).
    - Proof that another cell holds the single active write authority.
    - Revoked recovery credentials and the recorded disposition of the KMS key.
    - Confirmation that the off-provider encrypted backup survives the teardown with its expiry stated.
  preserved:
    - The encrypted off-provider backup and its declared expiry.
    - Offline OpenBao recovery material held by Steven.
    - Recovery exercise measurements and audit roots.
  blockedWhile:
    - Production is not confirmed healthy and is not the single active write authority.
    - Invocation-ledger reconciliation from a failover is incomplete.
    - The off-provider encrypted backup has not been verified as restorable.
    - Any target resource remains ambiguous (FRANK-§16.3.1 step 2).

resources:
  profile: warm-recovery-cell
  vcpu: 8
  memoryGb: 64
  diskGb: 400
  osReserve:
    memoryGb: 8
    cpuPercent: 15
  memoryEnvelopesGb:
    postgresql: 8
    workflowEventCache: 5
    webApi: 4
    identitySecretsEdge: 3
    buzz: 4
    objectServices: 2
    modelMemoryServices: 6
    observability: 6
    controlPlaneWorkers: 8
    uncommittedReserve: 10
  diskQuotasGb:
    canonicalDatabase: 80
    objects: 180
    logsTraces: 30
    buzz: 25
    workflowEventStores: 25
    imagesCaches: 20
    emergencyReserve: 40
  lifecycleThresholdsPercent:
    alert: 65
    throttle: 75
    contain: 85
  notes: >-
    Sized to the FRANK-§16.6 control-VPS reference profile. FRANK-§16.6 does not size the
    recovery cell — a gap filled here by matching production, because a warm cell smaller
    than production cannot serve production's load after failover and would turn a
    15-minute availability objective into an immediate capacity incident. The cell runs warm
    at a lower steady-state utilisation (standby replication, probes, no interactive or
    model work), so the reserved envelope is largely idle until admission; that idle cost is
    the price of the FRANK-§19.3 objective, not waste to be trimmed.
