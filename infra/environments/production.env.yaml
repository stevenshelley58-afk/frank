# FRANK environment definition — validates against ./schema.json (schema://frank.environment/v1)
# FRANK-§16.4: "Production: frank.fail, immutable artifacts, controlled promotion."
#
# Nothing in this file is stood up during Slice 0.

schema: frank.environment/v1
name: production
title: FRANK production cell
status: defined

purpose: >-
  Steven's single private cell: the control and data plane on the VPS, serving the complete
  browser product at `frank.fail`. It is the only environment that holds real owner data,
  the only active writer of canonical FRANK state under normal operation, and the only
  environment permitted real external side effects.

specRefs:
  - FRANK-§16.4
  - FRANK-§16.1
  - FRANK-§16.2
  - FRANK-§16.3
  - FRANK-§16.6
  - FRANK-§16.7
  - FRANK-§18.2
  - FRANK-§18.4
  - FRANK-§2.3
  - FRANK-§2.4
  - FRANK-§13.5

topology:
  boundary: control-plane-cell
  providerAccount: vps-provider
  dedicatedTelemetryNode: false
  notes: >-
    FRANK-§16.1: the control and data plane runs on the VPS behind Caddy; untrusted
    execution and previews run on a separate worker; the warm recovery cell, KMS, backup
    destination, and DNS failover path live in an independent provider account. The
    telemetry node of FRANK-§16.6 is a separate host and is enabled only after a
    production-shaped load test sizes it.

services:
  present:
    - reverse-proxy
    - web
    - domain-api
    - durable-workflows
    - canonical-database
    - object-storage
    - cache
    - event-transport
    - model-gateway
    - untrusted-execution
    - collaboration
    - knowledge-projection
    - identity
    - machine-secrets
    - telemetry
    - agent-evaluation
    - metrics
    - logs
    - traces
    - dashboards
    - availability-checks
    - private-access
  optional:
    - llm-observability
  absent:
    - preview-hosting
  notes:
    untrusted-execution: >-
      Present as a dependency of production agent work, but it runs on the separate
      execution worker with no control-plane network (FRANK-§16.1). FRANK-§16.6 is explicit
      that the control VPS runs no untrusted build microVM. FRANK-§15.4: if no compliant
      execution worker is healthy, untrusted work queues or moves to an approved isolated
      cloud sandbox; it never falls back to the control plane.
    preview-hosting: >-
      Production serves no previews. The preview host is owned by the `preview` environment
      on `*.preview.SANDBOX_BASE_DOMAIN` (FRANK-§16.3).
    llm-observability: >-
      FRANK-§16.6: Langfuse is not admitted to the 64 GB control VPS and runs on a dedicated
      telemetry node when enabled. FRANK-§16.2: it is never canonical run state and is never
      required for FRANK to operate — losing it never blocks work.
    knowledge-projection: >-
      PostgreSQL/pgvector baseline. FRANK-§16.2: no graph engine is promoted before eval,
      and projections are rebuildable, never canonical.
    machine-secrets: >-
      OpenBao with integrated Raft storage, auto-unsealed by a deletion-protected per-cell
      KMS key held in the independent recovery account (FRANK-§15.3).

dataClassification:
  ceiling: sensitive
  mayHoldPrivate: true
  mayHoldSensitive: true
  dataOrigin: real-owner-data
  rationale: >-
    Production holds email, calendar, contacts, private code, and personal notes (`private`)
    and, once the relevant compartments are explicitly activated, health, finance, location
    history, identity documents, and family records (`sensitive`) — FRANK-§2.3. It is the
    only environment that may. `secret`-class material (passwords, recovery codes, private
    keys, raw tokens) is not domain data here: it lives in OpenBao and reaches workloads as
    an opaque handle or a brokered operation, never in model context (FRANK-§15.3).
    Sensitive compartments are scoped per FRANK-§2.3, so "may hold sensitive" is a ceiling,
    not a default grant to every agent in the cell.

network:
  registrableDomain: frank.fail
  hostnames:
    - frank.fail
    - api.frank.fail
    - auth.frank.fail
    - rooms.frank.fail
    - hooks.frank.fail
    - status.frank.fail
  publicDns: true
  adminConsolesPublicDns: false
  edge: Caddy with automatic TLS, secure headers, streaming, and rate-limit integration
  egress: allowlist
  notes: >-
    Exactly the FRANK-§16.3 domain map. Admin consoles are private-network only and receive
    no public DNS unless required. `hub.frank.fail` exists only as the temporary redirect of
    FRANK-§16.3.1 step 8 and receives no new canonical writes. FRANK-§21 Workstream 3
    verification: a public port scan must expose only intended edge services.

isolation:
  cellId: frank-production
  sharesCredentials: false
  sharesWritableDatabase: false
  isolatedFromProduction: []
  identityAudience: frank-production
  notes: >-
    FRANK-§2.4: FRANK is a single private cell; later white-label deployments are separate
    cells, not tenants sharing this data plane. `isolatedFromProduction` is empty because
    this is production — the axis is meaningless against itself, and an entry here would be
    a modelling error rather than a stronger control.

traffic:
  acceptsOrdinaryUserTraffic: true
  publicAccess: authenticated-only
  canonicalWriteAuthority:
    holdsCanonicalData: true
    mayBecomeActiveWriter: true
    requiresFencingOfPriorWriter: false
  notes: >-
    The normal active writer. FRANK-§16.1 permits exactly one active write authority at a
    time across the production and recovery pair; during a failover this cell must be fenced
    before recovery admits traffic, and it must be fenced again before it can be returned to
    service. Public DNS exists, but every route requires authenticated identity with
    passkey/WebAuthn MFA (FRANK-§16.2).

externalSideEffects:
  allowed: true
  mode: permitted
  idempotencyLedger: true
  rationale: >-
    The only environment permitted real external side effects. Every connector command
    declares a FRANK-§13.5 side-effect class — `native-idempotent`, `query-reconcile`,
    `compensatable`, or `non-idempotent` — and every effect passes the idempotency ledger.
    Invocation state is prepared → attempted → observed; a lost response becomes
    `outcome_unknown`, never "failed", and reconciliation may move it to observed,
    compensated, or held, but may not blindly call the provider again. FRANK-§18.2 requires
    zero duplicate irreversible side effects under retry, replay, timeout, and
    webhook-redelivery suites before this permission is exercised by a release.

secrets:
  source: openbao
  shortLivedCredentials: true
  longLivedProviderKeys: scoped-broker-injected
  unsealPath: >-
    Deletion-protected per-cell KMS key in the independent recovery provider account,
    outside the FRANK VPS provider, with offline threshold recovery material held by Steven
    across separate physical or password-manager locations (FRANK-§15.3).
  notes: >-
    Agents receive opaque credential handles; raw secrets are redacted before every model,
    log, trace, event, and artifact boundary. The bootstrap root token is revoked once
    narrowly scoped administration identities exist. Rotation, revocation, expiry, last use,
    and owner are tracked. FRANK-§17.2: infrastructure code contains no secrets.

backup:
  posture: continuous-wal-and-offcell
  offCell: true
  restoreTested: monthly-isolated-restore
  retention: >-
    FRANK-§16.8 baseline — point-in-time recovery 14 days, daily backups 35 days, weekly 12
    weeks, monthly 24 months. Backup expiry is part of deletion evidence: FRANK must never
    claim immediate physical erasure from an immutable backup still inside its declared
    retention window.
  recoveryPointMinutes: 5
  notes: >-
    FRANK-§16.7: continuous WAL archiving plus scheduled encrypted full backups, versioned
    object replication to independent proven Object Lock storage, configuration, identity,
    Buzz, secret-metadata, and key-escrow procedures, automated integrity checks, a monthly
    isolated restore of all critical stores, a quarterly full-cell recovery exercise, and
    offline runbooks. A signed recovery manifest records mutually consistent PostgreSQL
    LSNs, object manifest root, Temporal namespace point, identity and secret snapshot IDs,
    Buzz position, audit-chain root, configuration commit, image digests, and decryption-key
    references. Numeric objectives are not met by backup age alone — recovery point is
    proven by restored records after a destructive drill (FRANK-§19.3).

promotion:
  promotesFrom:
    - staging
    - recovery
  promotesTo:
    - recovery
  artifact:
    builtHere: false
    digestSource: staging
    isReleaseEvidenceAnchor: false
    requiresDigestMatchingStagingEvidence: true
    rebuildForbidden: true
  gates:
    - FRANK-§18.2 "Release identity" — the promoted digest is byte-identical to the digest in the staging evidence pack.
    - FRANK-§18.3 — requirements and acceptance evidence complete; all mandatory deterministic checks pass.
    - FRANK-§18.3 — critical findings resolved and never waivable; high security, isolation, authorization, data-loss, integrity, and recovery findings resolved and not waivable.
    - FRANK-§18.3 — migrations and compatibility rehearsed; preview journeys pass; observability and alerts cover the change.
    - FRANK-§18.3 — backup or recovery point confirmed where state changes; a recovery procedure is executable.
    - FRANK-§18.3 — artifact provenance, SBOM, and signatures exist; the evidence pack is immutable and linked.
    - FRANK-§18.4 — expand/contract migrations, feature flags for risky behaviour, canary workers and model routes before broad enablement.
  notes: >-
    Production never builds and never rebuilds. It consumes the exact digest recorded in
    staging evidence, which is what makes FRANK-§18.2 "Release identity" checkable rather
    than aspirational. `promotesTo: recovery` is not a deployment of user traffic: it is the
    requirement of FRANK-§16.1 that the warm recovery cell hold signed release images for
    the running version, so a failover starts the same artifact rather than an older one.
    `recovery` also appears in `promotesFrom` for the failback direction only — after a
    failover, canonical state is repatriated from the warm cell to a rebuilt production cell.
    That edge carries state and write authority, never an artifact digest; `digestSource`
    remains `staging` in both directions.

lifetime:
  model: permanent
  disposable: false
  rebuildableFromDefinition: true
  notes: >-
    Permanent and not disposable — it is the only copy of the live product. It remains
    rebuildable from this definition plus backups; FRANK-§16.7 targets full operating
    service on a clean replacement host within 60 minutes, and the quarterly exercise
    destroys a source cell and rebuilds it in the independent account within that target.

destruction:
  triggers:
    - Owner-directed decommissioning of the cell
    - Completion of a quarterly full-cell recovery exercise that rebuilt the cell
    - The FRANK-§16.3.1 legacy-cutover path, after the rollback window
  method: >-
    FRANK-§16.3.1 steps 10–12. The retired cell is kept stopped, network-isolated, and
    read-only for 14 consecutive healthy days unless Steven records a shorter rollback
    window. Only then are the exact project, volumes, databases, buckets, credentials,
    rules, certificates, and obsolete DNS records destroyed.
  evidence:
    - Signed inventory of every resource before destruction (FRANK-§16.3.1 step 3).
    - Destruction manifest containing every removed resource ID, provider receipt, remaining backup, backup expiry, revoked credential, and verification query (step 12).
    - Proof that a restore of the declared encrypted backup succeeded before destruction.
    - Confirmation that no unidentified resource was removed (step 2 refuses destructive work while any target is ambiguous).
  preserved:
    - The declared encrypted off-provider backup and its stated expiry.
    - Destruction evidence itself.
    - Security and consequential-action audit records — 24 months online, then encrypted archive (FRANK-§16.8).
  blockedWhile:
    - Any target resource remains ambiguous (FRANK-§16.3.1 step 2).
    - The 14-day rollback window has not elapsed.
    - A restore of the declared backup has not been verified.
    - Another environment has not been confirmed as the single active write authority.

resources:
  profile: reference-control-vps
  vcpu: 8
  memoryGb: 64
  diskGb: 400
  osReserve:
    memoryGb: 8
    cpuPercent: 15
  memoryEnvelopesGb:
    postgresql: 8
    workflowEventCache: 5
    webApi: 4
    identitySecretsEdge: 3
    buzz: 4
    objectServices: 2
    modelMemoryServices: 6
    observability: 6
    controlPlaneWorkers: 8
    uncommittedReserve: 10
  diskQuotasGb:
    canonicalDatabase: 80
    objects: 180
    logsTraces: 30
    buzz: 25
    workflowEventStores: 25
    imagesCaches: 20
    emergencyReserve: 40
  lifecycleThresholdsPercent:
    alert: 65
    throttle: 75
    contain: 85
  concurrency:
    maxHeavyBuilds: 2
    maxLightJobs: 6
  notes: >-
    FRANK-§16.6 reference profile. PostgreSQL, identity, workflow, and secret services have
    priority and cannot be OOM-evicted by ingestion, indexing, telemetry, or model work.
    Lifecycle automation alerts at 65%, throttles nonessential work at 75%, and contains
    write-heavy workers at 85%. The concurrency limits belong to the separate execution
    worker, not to the control VPS. Deployment discovery records the actual host before
    provisioning, and resizing follows measurement of CPU, memory, I/O, queue depth, and
    storage growth — never a guess.
