server {
  listen 80 default_server;
  server_name hub.frank.fail _;

  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=30s ipv6=off;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
  }

  location /vps-browser/ {
    set $browser_upstream browser:5800;
    rewrite ^/vps-browser/(.*)$ /$1 break;
    proxy_pass http://$browser_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # AionUi is served at its own origin, but hub.frank.fail/aionui remains a
  # convenience entrypoint. It must hit the Frank API first so the AionUi
  # session cookie is minted before the browser enters AionUi.
  location = /aionui {
    return 302 /api/v1/aionui/open;
  }

  location /aionui/ {
    return 302 /api/v1/aionui/open;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name aionui.frank.fail;
  resolver 127.0.0.11 valid=30s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # First-load requests must go through Frank's API to mint the AionUi cookie.
  # After the API redirects back with frank_bootstrapped=1, serve the private
  # AionUi WebUI at the origin root. Cloudflare Access must gate this hostname
  # with the same policy as hub.frank.fail.
  location = / {
    if ($arg_frank_bootstrapped != "1") {
      return 302 https://hub.frank.fail/api/v1/aionui/open;
    }

    set $aionui_upstream aionui:25808;
    proxy_pass http://$aionui_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    set $aionui_upstream aionui:25808;
    proxy_pass http://$aionui_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Frame-Options;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
