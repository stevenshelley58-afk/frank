<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frank shared graph workbench harness</title>
  <link rel="stylesheet" href="./graph-workbench.bundle.css">
</head>
<body>
  <main id="workbench"></main>
  <script type="module">
    import { mountGraphWorkbench } from "./graph-workbench.bundle.js";
    const query = new URLSearchParams(location.search);
    let fail = false;
    let calls = 0;
    const rendererSequence = [];
    const graphId = "tool:fixture-tool";
    const projectGraphId = "project:fixture-project";
    const observedAt = "2026-08-14T00:00:00Z";
    const source = {
      manifest_id: "fixture-tool",
      manifest_version: "0.1.1",
      pipeline_id: "main",
      pipeline_version: "0.1.1",
      sha256: `sha256:${"d".repeat(64)}`,
    };
    const node = (id, label = id, entry = false) => ({
      id: `${graphId}/pipeline:main/node:${id}`,
      source_id: id,
      kind: "step",
      label,
      scope: { kind: "global" },
      authority: "manifest",
      source: { ...source },
      classification: "unspecified",
      freshness: { observed_at: observedAt },
      capabilities: [],
      ports: [],
      status: "declared",
      presentation: {},
      extensions: { "frank.graph.entry": entry },
    });
    const edge = (sourceId, from, to) => ({
      id: `${graphId}/pipeline:main/edge:${sourceId}:${from}:${to}`,
      source_id: sourceId,
      from: `${graphId}/pipeline:main/node:${from}`,
      to: `${graphId}/pipeline:main/node:${to}`,
      kind: "control",
      authority: "manifest",
      classification: "unspecified",
      source: { ...source },
      freshness: { observed_at: observedAt },
      status: "declared",
      presentation: {},
      extensions: {},
    });
    const projectSource = (sourceType, id) => ({
      provider_id: sourceType === "code" ? "repository" : sourceType,
      provider_version: "1.0.0",
      source_type: sourceType,
      source_ref: `${sourceType}/${id}`,
      sha256: `sha256:${"e".repeat(64)}`,
    });
    const projectNode = (id, sourceType, label = id) => ({
      id: `${projectGraphId}/node:${id}`,
      source_id: id,
      kind: sourceType,
      label,
      scope: { kind: "project", id: "fixture-project" },
      authority: "provider",
      source: projectSource(sourceType, id),
      classification: "internal",
      freshness: { observed_at: observedAt },
      capabilities: [],
      ports: [],
      status: "declared",
      presentation: { group_id: `${projectGraphId}/group:${sourceType}` },
      extensions: {},
    });
    const projectEdge = (sourceId, from, to) => ({
      id: `${projectGraphId}/edge:${sourceId}`,
      source_id: sourceId,
      from: `${projectGraphId}/node:${from}`,
      to: `${projectGraphId}/node:${to}`,
      kind: "relation",
      authority: "provider",
      classification: "internal",
      source: projectSource("memory", sourceId),
      freshness: { observed_at: observedAt },
      status: "declared",
      presentation: {},
      extensions: {},
    });
    const projectSnapshot = (large = false) => {
      const types = ["code", "vault", "memory"];
      const nodes = types.map((type) => projectNode(`${type}-root`, type, type[0].toUpperCase() + type.slice(1)));
      if (large) for (let index = 0; index < 4997; index += 1) nodes.push(projectNode(`memory-${index}`, "memory"));
      const edges = [];
      for (let index = 0; index < Math.min(10000, nodes.length - 1); index += 1) edges.push(projectEdge(`link-${index}`, nodes[index].source_id, nodes[index + 1].source_id));
      return {
        schema: "schema://frank.graph/v2",
        graph_id: projectGraphId,
        graph_revision: `sha256:${"f".repeat(64)}`,
        generated_at: observedAt,
        provider: { id: "knowledge", version: "1.0.0", authority: "provider" },
        subject: { kind: "project", id: "fixture-project" },
        scope: { kind: "project", id: "fixture-project" },
        lens: "knowledge.combined",
        capabilities: ["inspect"],
        nodes,
        edges,
        groups: types.map((type, index) => ({ id: `${projectGraphId}/group:${type}`, label: type[0].toUpperCase() + type.slice(1), parent_id: null, order: index })),
        trace_ref: null,
        extensions: {},
      };
    };
    const snapshot = (label = "prepare", revision = "a", large = false) => ({
      schema: "schema://frank.graph/v1",
      graph_id: graphId,
      graph_revision: `sha256:${revision.repeat(64)}`,
      generated_at: observedAt,
      provider: { id: "tool-manifest", version: "1.0.0", authority: "manifest" },
      subject: { kind: "tool", id: "fixture-tool" },
      scope: { kind: "global" },
      lens: "tool.pipeline",
      capabilities: ["inspect"],
      nodes: large ? [node("prepare", label, true), node("publish"), ...Array.from({ length: 120 }, (_, index) => node(`step-${index}`))] : [node("prepare", label, true), node("publish")],
      edges: [edge(0, "prepare", "publish")],
      groups: [],
      trace_ref: null,
      extensions: {},
    });
    const invalidSnapshot = (mode) => {
      if (mode?.startsWith("v2-")) {
        const value = projectSnapshot();
        if (mode === "v2-unknown-root") value.injected = true;
        else if (mode === "v2-bad-source") value.nodes[0].source.source_ref = "<private>";
        else if (mode === "v2-bad-reference") value.edges.push(projectEdge("link-0", "code-root", "missing"));
        else if (mode === "v2-too-many-nodes") value.nodes = Array.from({ length: 5001 }, (_, index) => projectNode(`memory-${index}`, "memory"));
        else if (mode === "v2-trace") value.trace_ref = { trace_id: "forbidden" };
        return value;
      }
      const value = snapshot();
      if (mode === "revision") value.graph_revision = "invalid";
      else if (mode === "unknown-root") value.injected = true;
      else if (mode === "node-incomplete") delete value.nodes[0].source;
      else if (mode === "html") value.nodes[0].label = "<b>unsafe</b>";
      else if (mode === "control") value.nodes[0].label = "bad\u0001label";
      else if (mode === "nonfinite") value.extensions = { "frank.graph.selection": { node_id: Number.NaN } };
      else if (mode === "duplicate-node") value.nodes.push(structuredClone(value.nodes[0]));
      else if (mode === "bad-reference") value.edges[0].to = `${graphId}/pipeline:main/node:missing`;
      else if (mode === "duplicate-edge") {
        value.nodes.push(node("archive"));
        value.edges.push(edge(0, "prepare", "archive"));
      }
      else if (mode === "group-cycle") value.groups = [
        { id: "one", label: "One", parent_id: "two" },
        { id: "two", label: "Two", parent_id: "one" },
      ];
      return value;
    };
    const mounted = mountGraphWorkbench(document.querySelector("#workbench"), {
      kind: query.get("project") === "1" ? "project" : "tool",
      entityId: query.get("project") === "1" ? "fixture-project" : "fixture-tool",
      lens: query.get("project") === "1" ? "knowledge.combined" : "tool.pipeline",
      title: query.get("project") === "1" ? "Fixture project" : "Fixture tool",
      load: async () => {
        calls += 1;
        const call = calls;
        if (query.get("project") === "1") return query.get("invalid")?.startsWith("v2-") ? invalidSnapshot(query.get("invalid")) : projectSnapshot(query.get("large-project") === "1");
        if (query.get("cycle") === "1") {
          await new Promise((resolve) => setTimeout(resolve, 20));
          return snapshot(call === 2 ? "small" : "large", call === 2 ? "a" : "c", call !== 2);
        }
        if (query.get("race") === "1") {
          await new Promise((resolve) => setTimeout(resolve, call === 1 ? 180 : 10));
          return call === 1 ? snapshot("stale", "b") : snapshot("latest", "c");
        }
        if (fail) {
          await new Promise((resolve) => setTimeout(resolve, 40));
          throw new Error("Graph is unavailable.");
        }
        if (query.get("invalid")) return invalidSnapshot(query.get("invalid"));
        return snapshot();
      },
      onRenderer: (renderer) => {
        rendererSequence.push(renderer);
        document.body.dataset.rendererSequence = rendererSequence.join(",");
      },
    });
    if (query.get("race") === "1") setTimeout(() => void mounted.reload(), 0);
    if (query.get("cycle") === "1") {
      setTimeout(() => void mounted.reload(), 80);
      setTimeout(() => void mounted.reload(), 160);
    }
    if (query.get("failure") === "after-ready") {
      const waitForReady = () => {
        if (document.querySelector("#workbench").dataset.graphState === "ready") {
          fail = true;
          const pending = mounted.reload();
          const workbench = document.querySelector("#workbench");
          const canvas = workbench.querySelector(".graph-canvas");
          document.body.dataset.pendingCleared = canvas.textContent.includes("prepare") || workbench.querySelector(".graph-meta").textContent ? "no" : "yes";
          void pending;
        } else {
          requestAnimationFrame(waitForReady);
        }
      };
      requestAnimationFrame(waitForReady);
    }
  </script>
</body>
</html>
