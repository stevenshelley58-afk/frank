name: frank

services:
  frank-window:
    build:
      context: ../..
      dockerfile: apps/window/Dockerfile
    image: frank-window:current
    container_name: frank-window
    restart: unless-stopped
    env_file:
      - ${FRANK_WINDOW_ENV_FILE:-/srv/frank/secrets/window.env}
      - /var/lib/frank/release/feature-flags.env
    environment:
      FRANK_WEB: /web
      CHAT_STORE_DIR: /data
      PROJECTS_STORE_FILE: /data/projects.json
      PROJECT_KNOWLEDGE_ROOT: /data/knowledge
      HERMES_SHARED_UPLOAD_ROOT: /srv/frank/data/window/uploads
      HERMES_API_URL: http://172.16.1.1:8642
      HERMES_PROFILE: default
      MINI_PREVIEW_ROOT: /previews/mini
      MINI_LEGACY_PROJECT_ROOT: /legacy-mini-projects
      HINDSIGHT_API_URL: http://172.16.1.1:9178
      # The observer shares this container's loopback namespace. Its other
      # local endpoints are never routed through Frank or Caddy.
      AGENTTRAIL_URL: http://127.0.0.1:5340
      CONNECTIONS_STORE_FILE: /data/connections.json
      CONNECTION_ACTIONS_FILE: /data/connection-actions.jsonl
      CONNECTION_PLANS_FILE: /data/connection-plans.json
      VAULT_METADATA_FILE: /data/vault-metadata.json
      VPS_ROOT: /vps
      PORT: "8080"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - /srv/frank/data/window:/data
      - /srv/frank/previews/mini:/previews/mini
      - /projects/mini-frank/customer-projects:/legacy-mini-projects
      # Project browsing is limited to named product roots. Host-wide
      # inventory reaches Window only through redacted control receipts.
      - /projects/frank:/vps/projects/frank:ro
      - /projects/mini-frank:/vps/projects/mini-frank:ro
      - /projects/blockwise-product-release-21a192cd2420:/vps/projects/blockwise:ro
      - /projects/merrypaws:/vps/projects/merrypaws:ro
      - /projects/elfandwonder:/vps/projects/elfandwonder:ro
      - /projects/pavone-demo:/vps/projects/pavone-demo:ro
    networks:
      - frank
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frank-agenttrail:
    build:
      context: ../..
      dockerfile: apps/window/Dockerfile
      target: agenttrail-runtime
    image: frank-agenttrail:current
    container_name: frank-agenttrail
    restart: unless-stopped
    network_mode: "service:frank-window"
    depends_on:
      frank-window:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # AgentTrail observes implementation changes only. This mount is
      # read-only and never represents generator run truth.
      - ${FRANK_AGENTTRAIL_REPO:-/projects/only-process-hermes}:/workspace:ro
      - agenttrail_state:/home/node/.agenttrail

  frank-caddy:
    image: caddy:2.8-alpine
    container_name: frank-caddy
    restart: unless-stopped
    env_file:
      - ${FRANK_CADDY_ENV_FILE:-/srv/frank/secrets/caddy.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/frank/previews:/srv/frank/previews:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frank
      # Blockwise owns its services and state on a separate Compose network.
      # Frank's edge is the only Frank container allowed to join it.
      - blockwise-product
    depends_on:
      frank-window:
        condition: service_healthy

volumes:
  caddy_data:
    name: frank_caddy_data
  caddy_config:
    name: frank_caddy_config
  agenttrail_state:
    name: frank_agenttrail_state

networks:
  frank:
    external: true
    name: frank
  blockwise-product:
    external: true
    name: blockwise-product
