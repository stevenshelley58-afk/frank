services:
  neo4j:
    image: ${NEO4J_IMAGE:?set an immutable Neo4j image digest, for example neo4j@sha256:...}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in the secret environment}
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_advertised__address: localhost:7687
      NEO4J_server_http_advertised__address: localhost:7474
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [knowledge-private]

  hermes-graphiti-provider:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set in the secret environment}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set in the secret environment}
      HERMES_GRAPHITI_PROVIDER_TOKEN: ${HERMES_GRAPHITI_PROVIDER_TOKEN:?set in the secret environment}
      HERMES_ALLOWED_NAMESPACES: ${HERMES_ALLOWED_NAMESPACES:?comma-separated exact namespaces required}
      BIND_HOST: 0.0.0.0
      BIND_PORT: 8091
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ${FRANK_KNOWLEDGE_ROOT:?set to the read-only /srv/frank/knowledge root}:/knowledge:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8091/readyz', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [knowledge-private, knowledge-egress]

  frank-knowledge-projection:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "projection_server.py"]
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set in the secret environment}
      FRANK_KNOWLEDGE_PROJECTION_TOKEN: ${FRANK_KNOWLEDGE_PROJECTION_TOKEN:?separate Frank projection token required}
      FRANK_KNOWLEDGE_ALLOWED_PROJECTS: ${FRANK_KNOWLEDGE_ALLOWED_PROJECTS:?exact project allow-list required}
      FRANK_KNOWLEDGE_VAULT_DIR: /knowledge
      FRANK_KNOWLEDGE_GRAPHIFY_DIR: /knowledge
      BIND_HOST: 0.0.0.0
      BIND_PORT: 8092
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ${FRANK_KNOWLEDGE_ROOT:?set to the read-only /srv/frank/knowledge root}:/knowledge:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8092/readyz', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [knowledge-private, frank]

volumes:
  neo4j-data:
  neo4j-logs:
networks:
  knowledge-private:
    internal: true
  knowledge-egress:
  frank:
    external: true
