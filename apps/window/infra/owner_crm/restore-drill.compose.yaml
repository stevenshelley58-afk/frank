# One-shot, internal-only native restore drill. The wrapper supplies a unique project/site/root.
x-runtime-labels: &runtime-labels
  io.frank.owner-crm.applied-source-sha: ${OWNER_CRM_SOURCE_SHA:?OWNER_CRM_SOURCE_SHA is required}
  io.frank.owner-crm.restore-drill: "true"

x-bench: &bench
  image: ${OWNER_CRM_IMAGE:?OWNER_CRM_IMAGE is required}:${OWNER_CRM_TAG:?OWNER_CRM_TAG is required}
  pull_policy: never
  restart: "no"
  labels: *runtime-labels
  volumes:
    - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/sites:/home/frappe/frappe-bench/sites
    - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/logs:/home/frappe/frappe-bench/logs
  networks: [restore-drill-internal]

services:
  db:
    image: mariadb:11.8@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    pull_policy: never
    restart: "no"
    labels: *runtime-labels
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--transaction-isolation=READ-COMMITTED", "--skip-name-resolve"]
    environment:
      MYSQL_ROOT_PASSWORD: ${OWNER_CRM_DB_PASSWORD:?OWNER_CRM_DB_PASSWORD is required}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/mariadb:/var/lib/mysql
    networks: [restore-drill-internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis-cache:
    image: redis:8.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
    pull_policy: never
    restart: "no"
    labels: *runtime-labels
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [restore-drill-internal]

  redis-queue:
    image: redis:8.6-alpine@sha256:75934ddb37bfaebe3b4082ba673cac39f66495244134f33dd0a502ce03cdcd36
    pull_policy: never
    restart: "no"
    labels: *runtime-labels
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/redis-queue:/data
    networks: [restore-drill-internal]

  restore:
    <<: *bench
    volumes:
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/sites:/home/frappe/frappe-bench/sites
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/logs:/home/frappe/frappe-bench/logs
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/input:/backup:ro
    entrypoint: ["bash", "-ec"]
    command:
      - >-
        test ! -e "sites/${OWNER_CRM_DRILL_SITE}";
        if test ! -e sites/common_site_config.json; then
          (umask 077; set -C; printf '{}\n' > sites/common_site_config.json) 2>/dev/null || test -f sites/common_site_config.json;
        fi;
        test -f sites/common_site_config.json && test ! -L sites/common_site_config.json;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -g mute_emails 1;
        bench set-config -g enable_scheduler 0;
        bench new-site "${OWNER_CRM_DRILL_SITE}" --mariadb-user-host-login-scope=% --db-root-username=root --db-root-password="${OWNER_CRM_DB_PASSWORD}" --admin-password="${OWNER_CRM_ADMIN_PASSWORD}" --install-app crm --install-app telephony --install-app helpdesk;
        bench --site "${OWNER_CRM_DRILL_SITE}" restore "${OWNER_CRM_BACKUP_SQL}" --db-root-username=root --db-root-password="${OWNER_CRM_DB_PASSWORD}" --admin-password="${OWNER_CRM_ADMIN_PASSWORD}" --install-app crm --install-app telephony --install-app helpdesk --with-public-files "${OWNER_CRM_BACKUP_PUBLIC}" --with-private-files "${OWNER_CRM_BACKUP_PRIVATE}" --force;
        bench --site "${OWNER_CRM_DRILL_SITE}" set-config mute_emails 1;
        bench --site "${OWNER_CRM_DRILL_SITE}" set-config enable_scheduler 0
    depends_on:
      db: {condition: service_healthy}
      redis-cache: {condition: service_started}
      redis-queue: {condition: service_started}

  verify-apps:
    <<: *bench
    entrypoint: ["bash", "-ec"]
    command: ['bench --site "${OWNER_CRM_DRILL_SITE}" list-apps']

  verify-custom-fields:
    <<: *bench
    entrypoint: ["bash", "-ec"]
    command: ['bench --site "${OWNER_CRM_DRILL_SITE}" execute frappe.get_all --kwargs "$${OWNER_CRM_CUSTOM_FIELDS_KWARGS}"']


  fixture-seed:
    <<: *bench
    volumes:
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/sites:/home/frappe/frappe-bench/sites
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/fixture-input:/fixture-input:ro
    entrypoint: ["bash", "-ec"]
    command:
      - >-
        key=$$(cat /fixture-input/encryption-key); secret=$$(cat /fixture-input/secret);
        bench --site "${OWNER_CRM_DRILL_SITE}" set-config encryption_key "$$key";
        public_args=$$(jq -cn --arg content "$$(cat /fixture-input/public.txt)" '{fname:"owner-crm-fixture-public.txt",content:$$content,dt:"System Settings",dn:"System Settings",is_private:0}');
        private_args=$$(jq -cn --arg content "$$(cat /fixture-input/private.txt)" '{fname:"owner-crm-fixture-private.txt",content:$$content,dt:"System Settings",dn:"System Settings",is_private:1}');
        secret_args=$$(jq -cn --arg pwd "$$secret" '{doctype:"CRM Twilio Settings",name:"CRM Twilio Settings",pwd:$$pwd,fieldname:"api_secret"}');
        bench --site "${OWNER_CRM_DRILL_SITE}" execute frappe.utils.file_manager.save_file --kwargs "$$public_args";
        bench --site "${OWNER_CRM_DRILL_SITE}" execute frappe.utils.file_manager.save_file --kwargs "$$private_args";
        bench --site "${OWNER_CRM_DRILL_SITE}" execute frappe.utils.password.set_encrypted_password --kwargs "$$secret_args"

  fixture-backup:
    <<: *bench
    volumes:
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/sites:/home/frappe/frappe-bench/sites
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/fixture-backup:/fixture-backup
    entrypoint: ["bash", "-ec"]
    command: ['bench --site "${OWNER_CRM_DRILL_SITE}" backup --with-files --backup-path /fixture-backup']

  fixture-restore:
    <<: *bench
    volumes:
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/sites:/home/frappe/frappe-bench/sites
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/fixture-backup:/fixture-backup:ro
    entrypoint: ["bash", "-ec"]
    command:
      - >-
        sql=$$(find /fixture-backup -maxdepth 1 -name '*.sql.gz' -type f -print -quit); public=$$(find /fixture-backup -maxdepth 1 -name '*-files.tar' ! -name '*-private-files.tar' -type f -print -quit); private=$$(find /fixture-backup -maxdepth 1 -name '*-private-files.tar' -type f -print -quit); config=$$(find /fixture-backup -maxdepth 1 -name '*site_config_backup.json' -type f -print -quit);
        test -n "$$sql" && test -n "$$public" && test -n "$$private" && test -n "$$config";
        test ! -e "sites/${OWNER_CRM_FIXTURE_SITE}";
        bench new-site "${OWNER_CRM_FIXTURE_SITE}" --mariadb-user-host-login-scope=% --db-root-username=root --db-root-password="${OWNER_CRM_DB_PASSWORD}" --admin-password="${OWNER_CRM_ADMIN_PASSWORD}" --install-app crm --install-app telephony --install-app helpdesk;
        bench --site "${OWNER_CRM_FIXTURE_SITE}" restore "$$sql" --db-root-username=root --db-root-password="${OWNER_CRM_DB_PASSWORD}" --admin-password="${OWNER_CRM_ADMIN_PASSWORD}" --install-app crm --install-app telephony --install-app helpdesk --with-public-files "$$public" --with-private-files "$$private" --force;
        key=$$(jq -r '.encryption_key // empty' "$$config"); test -n "$$key"; bench --site "${OWNER_CRM_FIXTURE_SITE}" set-config encryption_key "$$key";
        bench --site "${OWNER_CRM_FIXTURE_SITE}" set-config mute_emails 1; bench --site "${OWNER_CRM_FIXTURE_SITE}" set-config enable_scheduler 0

  fixture-verify:
    <<: *bench
    volumes:
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/sites:/home/frappe/frappe-bench/sites
      - ${OWNER_CRM_DRILL_ROOT:?OWNER_CRM_DRILL_ROOT is required}/fixture-input:/fixture-input:ro
    entrypoint: ["bash", "-ec"]
    command:
      - >-
        test "$$(find "sites/${OWNER_CRM_FIXTURE_SITE}/public/files" -type f | wc -l)" = 1;
        test "$$(find "sites/${OWNER_CRM_FIXTURE_SITE}/private/files" -type f | wc -l)" = 1;
        test "$$(sha256sum "$$(find "sites/${OWNER_CRM_FIXTURE_SITE}/public/files" -type f -print -quit)" | awk '{print $$1}')" = "$$(sha256sum /fixture-input/public.txt | awk '{print $$1}')";
        test "$$(sha256sum "$$(find "sites/${OWNER_CRM_FIXTURE_SITE}/private/files" -type f -print -quit)" | awk '{print $$1}')" = "$$(sha256sum /fixture-input/private.txt | awk '{print $$1}')";
        password_args=$$(jq -cn '{doctype:"CRM Twilio Settings",name:"CRM Twilio Settings",fieldname:"api_secret"}');
        test "$$(bench --site "${OWNER_CRM_FIXTURE_SITE}" execute frappe.utils.password.get_decrypted_password --kwargs "$$password_args")" = "$$(cat /fixture-input/secret)"


networks:
  restore-drill-internal:
    internal: true
