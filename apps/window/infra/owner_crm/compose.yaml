# Dedicated owner CRM and Helpdesk. It never joins customer networks.
name: owner-crm

x-image: &image
  image: ${OWNER_CRM_IMAGE:?OWNER_CRM_IMAGE is required}:${OWNER_CRM_TAG:?OWNER_CRM_TAG is required}
  pull_policy: never
  restart: unless-stopped

x-bench: &bench
  <<: *image
  volumes:
    - /srv/frank/owner-crm/sites:/home/frappe/frappe-bench/sites
    - /srv/frank/owner-crm/logs:/home/frappe/frappe-bench/logs
  networks: [owner-crm-internal]

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --transaction-isolation=READ-COMMITTED
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${OWNER_CRM_DB_PASSWORD:?OWNER_CRM_DB_PASSWORD is required}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - /srv/frank/owner-crm/mariadb:/var/lib/mysql
    networks: [owner-crm-internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [owner-crm-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /srv/frank/owner-crm/redis-queue:/data
    networks: [owner-crm-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  configurator:
    <<: *bench
    restart: "no"
    entrypoint: ["bash", "-ec"]
    command:
      - >-
        if test ! -e sites/common_site_config.json; then
          (umask 077; set -C; printf '{}\n' > sites/common_site_config.json) 2>/dev/null || test -f sites/common_site_config.json;
        fi;
        test -f sites/common_site_config.json && test ! -L sites/common_site_config.json;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
        bench set-config -g mute_emails 1;
        bench set-config -g enable_scheduler 0
    depends_on:
      db: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      redis-queue: {condition: service_healthy}

  backend:
    <<: *bench
    depends_on:
      configurator: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: owner.crm.internal", "http://localhost:8000/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  websocket:
    <<: *bench
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      configurator: {condition: service_completed_successfully}

  queue-short:
    <<: *bench
    command: ["bench", "worker", "--queue", "short,default"]
    depends_on:
      configurator: {condition: service_completed_successfully}

  queue-long:
    <<: *bench
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      configurator: {condition: service_completed_successfully}

  # There is deliberately no scheduler service. Starting one needs an explicit
  # later mail and integration review rather than an accidental compose upgrade.
  frontend:
    <<: *image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: owner.crm.internal
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
    volumes:
      - /srv/frank/owner-crm/sites:/home/frappe/frappe-bench/sites
      - /srv/frank/owner-crm/logs:/home/frappe/frappe-bench/logs
    depends_on:
      backend: {condition: service_healthy}
      websocket: {condition: service_started}
    ports:
      - "127.0.0.1:18081:8080"
    # Docker 29 does not publish a port from an internal-only network. The
    # frontend alone joins this ordinary bridge; every app and data service stays internal.
    networks: [owner-crm-internal, owner-crm-ingress]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: owner.crm.internal", "http://localhost:8080/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  create-site:
    <<: *bench
    profiles: [tools]
    restart: "no"
    entrypoint: ["bash", "-ec"]
    command:
      - >-
        test ! -e "sites/owner.crm.internal" || { echo "site path already exists"; exit 3; };
        bench new-site --mariadb-user-host-login-scope=% --db-root-username=root
        --db-root-password="${OWNER_CRM_DB_PASSWORD}" --admin-password="${OWNER_CRM_ADMIN_PASSWORD}"
        --install-app crm --install-app telephony --install-app helpdesk --set-default "owner.crm.internal";
        bench --site "owner.crm.internal" set-config mute_emails 1;
        bench --site "owner.crm.internal" set-config enable_scheduler 0;
        bench --site "owner.crm.internal" migrate
    depends_on:
      configurator: {condition: service_completed_successfully}

networks:
  owner-crm-internal:
    internal: true
  owner-crm-ingress:
    driver: bridge
