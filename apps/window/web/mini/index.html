<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Give Mini Frank a business problem and get a real, working solution.">
  <meta name="theme-color" content="#fefefd">
  <title>Mini Frank — Give us your problem</title>
  <link rel="stylesheet" href="/mini/mini.css">
  <script src="/mini/mini.js" defer></script>
</head>
<body>
  <!--
    THESIS: One calm conversation turns a plain business problem into a real result; no dashboard or technical machinery interrupts it.
    OWN-WORLD: Warm white paper, near-black type, fine neutral lines, generous pill controls, and one small amber Frank signal.
    STORY: Ask, optionally clarify, choose timing, follow the real job state, use the result, then request a change or handoff.
    FIRST VIEWPORT: A quiet header, one centred promise, and a labelled problem composer whose sole primary action is Start.
    FORM: Approved Mini Frank customer journey, translated directly from the signed-off mockup.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <a class="skip-link" href="#app">Skip to Mini Frank</a>
  <div class="site-shell">
    <header class="site-header">
      <button class="brand" type="button" data-action="home" aria-label="Mini Frank home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>frank.my</span>
      </button>
      <nav class="header-actions" aria-label="Mini Frank">
        <button class="text-button" type="button" data-action="how">How it works</button>
        <button class="outline-button" type="button" data-action="projects">My projects</button>
      </nav>
    </header>
    <main id="app" tabindex="-1" aria-live="polite" aria-busy="true"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Mini Frank needs JavaScript to start, save, and reopen your private projects.</p></noscript>
</body>
</html>
