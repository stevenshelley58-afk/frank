schema_version: 1
enabled: false
mode: report_only
oss_decision_id: receipt:oss-decision/cleanup-reporters
baseline: accepted_debt_baseline
timeout_seconds: 1800
reporters:
  knip:
    revision: 3c785f55ce608d7921e37e41dd5fc61b623e5da2
    languages: [javascript, typescript]
    command: [npx, --no-install, knip, --reporter, json]
  dependency-cruiser:
    revision: 1f28f44a49c054dc128226543188220818b1ab52
    languages: [javascript, typescript]
    command: [npx, --no-install, depcruise, --output-type, json]
  jscpd:
    revision: b816fb777d885d963c7167cd9ae81035c1731660
    languages: [javascript, typescript, python]
    command: [npx, --no-install, jscpd, --format, json]
  vulture:
    revision: 2c21cb0ae2afa657e36f6a397cb573608a65d79e
    languages: [python]
    command: [vulture, --json]
exclusions:
  directories: [.git, node_modules, __pycache__, .venv, venv, vendor, .tox]
  classes: [cache, quarantine, symlink_escape, unknown_root, full_instruction_body, conversation_and_session_state]
retention:
  receipts_days: 90
  stale_threshold_days: 8
  quota_warning_fraction: 0.8
  preserve_referenced: [current, last_known_good, release, rollback, proposal, finding]
safety:
  mutates_source: false
  mutates_runtime: false
  auto_delete: false
  auto_install: false
  no_shell: true
schedule:
  cadence: weekly
  owner: validation-owner
  disable_command: disable_cleanup_jobs
  stale_after: 8d
