canonical_commands:
  clean_worktree: git status --short --branch
  remote_baseline: git ls-remote origin refs/heads/main
  focused_tests: cd /projects/frank/apps/window && python -m unittest discover -s tests
  graph_contract_tests: cd /projects/frank/apps/window && python -m unittest tests.test_graph_contract tests.test_graph_provider
  javascript_syntax: cd /projects/frank && git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
  dashboard_build: cd /projects/frank/apps/window && npm run build:dashboard
  graph_build: cd /projects/frank/apps/window && npm run build:graph
  container_build: cd /projects/frank/apps/window && docker compose config --quiet && docker compose build frank-window frank-agenttrail
  deploy: cd /projects/frank && apps/window/deploy.sh
  post_deploy_health: docker inspect frank-window --format '{{.State.Health.Status}}' && curl --fail --silent --show-error https://frank.fail/frank/ >/dev/null
  rollback:
    status: resolved_per_release_receipt
    rule: Check out the exact prior accepted commit in the canonical clean checkout, run apps/window/deploy.sh, then require its health and approved-sha receipts to match that commit.
    forbidden: Never switch to or pull a mutable branch as the rollback target.
  preview:
    status: unavailable
    reason: No canonical isolated VPS preview command exists at the accepted baseline; Step 5 must add the preview-<run-slug> contract before preview use.

