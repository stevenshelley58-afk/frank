decision: compose
selected_candidate: Knip + dependency-cruiser + jscpd + Vulture (report-only)
custom_gap: null
rollback_removal_path: disable cleanup schedule and retain reports
reviewed_at: '2026-08-30'
reviewer: Step 1 OSS research lane
rationale: Language-specific upstream reporters cover distinct candidate classes; no reporter may delete files. Composition avoids a second cleanup daemon.
security_evidence:
- Scorecard project endpoints checked for dependency-cruiser (7.0), jscpd (7.4), Vulture (3.0); Knip endpoint returned 404.
- OSV/deps.dev are applicable only after exact package versions are pinned; no vulnerability claim is made for unpinned repository HEADs.
security_unknowns:
- Knip Scorecard endpoint unavailable; transitive package health requires lockfile scan.
cost: Four bounded CLI reports; no persistent service; retain raw reports for audit and removal.
