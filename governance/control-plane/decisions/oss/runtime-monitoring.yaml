rationale: Step 0 has no provider and the smallest defensible fallback is Beszel; the full telemetry composition is deferred until an authenticated VPS inventory proves a missing signal.
security_evidence:
- Scorecard and OSV API outcomes are recorded per candidate; exact release advisories remain a promotion gate.
security_unknowns:
- No provider was installed; runtime sizing, VPS auth route and retained-volume measurements require the isolated Step 4B test.
cost: Beszel target <=1 vCPU, <=256 MB RAM, <=1 GB retained history for 7 days; no licence fee; one authenticated read-only adapter.
