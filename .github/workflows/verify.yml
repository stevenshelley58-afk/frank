name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Baseline provenance tests verify an accepted deployed commit that may
          # predate HEAD. Keep the commit graph available instead of weakening
          # that evidence gate for CI's default one-commit checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/window/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r apps/window/requirements.txt
      - name: Python checks
        working-directory: apps/window
        env:
          CHAT_STORE_DIR: ${{ runner.temp }}/frank-window-data
          MINI_PREVIEW_ROOT: ${{ runner.temp }}/frank-window-previews
          MINI_LEGACY_PROJECT_ROOT: ${{ runner.temp }}/frank-window-legacy
        run: |
          mkdir -p "$CHAT_STORE_DIR" "$MINI_PREVIEW_ROOT" "$MINI_LEGACY_PROJECT_ROOT"
          python -m py_compile server.py
          python -m unittest discover -s tests
      - name: JavaScript checks
        run: |
          node --check apps/window/web/js/app.js
          node --check apps/window/web/js/registry.js
          node --check apps/window/web/js/widgets.js
      - name: Container build
        run: docker build -t frank-window:verify apps/window

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    if: always()
    needs: [window, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          WINDOW_RESULT: ${{ needs.window.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$WINDOW_RESULT" = "success"
          test "$SECRETS_RESULT" = "success"
