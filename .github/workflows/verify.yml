name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Baseline provenance tests verify an accepted deployed commit that may
          # predate HEAD. Keep the commit graph available instead of weakening
          # that evidence gate for CI's default one-commit checkout.
          fetch-depth: 0
          # The image builds pinned Archify and AgentTrail sources from the
          # repository's submodules; an empty gitlink cannot be a build input.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/window/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JavaScript dependencies
        working-directory: apps/window
        run: npm ci --ignore-scripts
      - run: pip install -r apps/window/requirements.txt
      - name: Window verification
        working-directory: apps/window
        run: npm run verify
      - name: Container build from immutable package
        working-directory: apps/window
        env:
          FRANK_IMMUTABLE_PACKAGE_BASE: ${{ runner.temp }}/frank-immutable-package
        run: |
          set -euo pipefail
          source ./deploy_lib.sh
          package="$(frank_create_immutable_package "$GITHUB_WORKSPACE" "$GITHUB_SHA")"
          trap 'frank_cleanup_immutable_package "$package"' EXIT
          docker build -f "$package/apps/window/Dockerfile" -t frank-window:verify "$package"
          docker build --target agenttrail-runtime -f "$package/apps/window/Dockerfile" -t frank-agenttrail:verify "$package"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    if: always()
    needs: [window, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          WINDOW_RESULT: ${{ needs.window.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$WINDOW_RESULT" = "success"
          test "$SECRETS_RESULT" = "success"
