# FRANK Track B1 — make `pnpm run verify` un-skippable.
#
# Runs the exact local gate chain on every push:
#   deps:check → contracts:validate → env:validate → registry:check
#   → turbo run typecheck lint test
#
# No secrets needed. Node 22 pinned by the repo `engines` range; pnpm version
# comes from the root `packageManager` field (pnpm/action-setup reads it).
name: verify

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.12
          cache: pip
          cache-dependency-path: apps/codegraph/requirements-test.lock

      # Unit tests exercise the Frank lifecycle/overlay layer and mock the
      # Graphify subprocess. Watchdog is their only imported runtime package.
      - name: Install codegraph test dependency
        run: python -m pip install --require-hashes -r apps/codegraph/requirements-test.lock

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run the full verify gate
        run: pnpm run verify
