name: secret-scan

# DEL-04 — secret scanning defense-in-depth.
#
# GitHub secret scanning + push protection are ENABLED at the repository level
# (one-time setting, see docs/ops/SECRET_HANDLING.md). This workflow is the
# belt-and-braces layer: gitleaks scans the full git history on every push and
# PR so anything GitHub's provider patterns miss is still caught in CI.
#
# No secrets needed to run this job.

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history — scan the whole repo, not just the tip

      - name: Run gitleaks against full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Config: repo-root .gitleaks.toml (empty allowlist today; extend only
          # with justification if a fixture false-positives).
