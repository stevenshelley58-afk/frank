name: release-artifacts

# Build release evidence only after the repository's full verify workflow has
# passed for a pushed commit. This deliberately has no deployment step and is
# not a preview/staging build path.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]

permissions: {}

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build-release-artifacts:
    # Publication is permitted only for the protected default branch after its
    # own successful push verification. This intentionally activates first on
    # a merge to main; branch and PR verification never receive write/OIDC
    # credentials through this workflow.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.repository.default_branch == 'main' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.sha == github.event.workflow_run.head_sha
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Prove the checkout is the verified full commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Define immutable image references
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'IMAGE_API=ghcr.io/%s/frank-api\n' "$owner" >> "$GITHUB_ENV"
          printf 'IMAGE_WEB=ghcr.io/%s/frank-web\n' "$owner" >> "$GITHUB_ENV"
          printf 'IMAGE_CODEGRAPH=ghcr.io/%s/frank-codegraph\n' "$owner" >> "$GITHUB_ENV"
          printf 'IMAGE_WORKBENCH=ghcr.io/%s/frank-workbench\n' "$owner" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Each service is built once from the same repository root and verified
      # commit. The digest, not this convenience SHA tag, is the release ID.
      - name: Build and push API image
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_API }}:${{ env.COMMIT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_WEB }}:${{ env.COMMIT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build and push codegraph image
        id: codegraph
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/codegraph/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_CODEGRAPH }}:${{ env.COMMIT_SHA }}
          build-args: |
            FRANK_SOURCE_URL=https://github.com/${{ github.repository }}
            FRANK_REVISION=${{ env.COMMIT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build and push workbench image
        id: workbench
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/workbench/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_WORKBENCH }}:${{ env.COMMIT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
          provenance: mode=max
          sbom: true

      - name: Validate immutable build digests
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          CODEGRAPH_DIGEST: ${{ steps.codegraph.outputs.digest }}
          WORKBENCH_DIGEST: ${{ steps.workbench.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$API_DIGEST" "$WEB_DIGEST" "$CODEGRAPH_DIGEST" "$WORKBENCH_DIGEST"; do
            printf '%s' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          done
          mkdir -p evidence

      - name: Generate API SBOM evidence
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_API }}@${{ steps.api.outputs.digest }}
          format: spdx-json
          output-file: evidence/api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate web SBOM evidence
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_WEB }}@${{ steps.web.outputs.digest }}
          format: spdx-json
          output-file: evidence/web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate codegraph SBOM evidence
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_CODEGRAPH }}@${{ steps.codegraph.outputs.digest }}
          format: spdx-json
          output-file: evidence/codegraph.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate workbench SBOM evidence
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_WORKBENCH }}@${{ steps.workbench.outputs.digest }}
          format: spdx-json
          output-file: evidence/workbench.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s evidence/api.spdx.json
          test -s evidence/web.spdx.json
          test -s evidence/codegraph.spdx.json
          test -s evidence/workbench.spdx.json
          node <<'NODE'
          import { readFileSync } from 'node:fs';

          for (const path of ['evidence/api.spdx.json', 'evidence/web.spdx.json', 'evidence/codegraph.spdx.json', 'evidence/workbench.spdx.json']) {
            const sbom = JSON.parse(readFileSync(path, 'utf8'));
            if (!sbom || typeof sbom !== 'object' || !sbom.spdxVersion) {
              throw new Error(`${path} is not an SPDX JSON document`);
            }
          }
          NODE

      - name: Exercise the exact promoted scratch runtime and supervisor
        shell: bash
        env:
          CODEGRAPH_DIGEST: ${{ steps.codegraph.outputs.digest }}
        run: |
          set -euo pipefail
          exact_image="$IMAGE_CODEGRAPH@$CODEGRAPH_DIGEST"
          docker pull "$exact_image"
          test "$(docker image inspect --format '{{.Config.User}}' "$exact_image")" = '10001:10001'
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$exact_image")" = '["/usr/local/bin/python3","-P","-m","frank_codegraph"]'
          jq -e '
            [(.packages // [])[]?.name | ascii_downcase |
              select(. == "pip" or . == "setuptools" or . == "wheel")] | length == 0
          ' evidence/codegraph.spdx.json >/dev/null

          container_id="$(docker create "$exact_image")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true; rm -f rootfs.tar' EXIT
          docker export "$container_id" --output rootfs.tar
          if tar -tf rootfs.tar | grep -Eq '(^|/)(bin/(a|ba|da|z)?sh|sbin/apk|usr/(local/)?bin/pip([0-9.]*)?)(/|$)'; then
            echo 'scratch runtime unexpectedly contains a shell, apk, or pip' >&2
            exit 1
          fi
          if tar -tf rootfs.tar | grep -Eq '(^|/)usr/local/lib/python3\.14/(tarfile\.py|html/parser\.py|lib-dynload/_tkinter[^/]*\.so|.*\.py[co])$|(^|/)usr/local/lib/python3\.14/(tkinter|idlelib|turtledemo)(/|$)|(^|/)__pycache__(/|$)'; then
            echo 'removed stdlib modules or bytecode remain in scratch runtime' >&2
            exit 1
          fi

          mkdir -p runtime-acceptance/project runtime-acceptance/output
          chmod 0777 runtime-acceptance/output
          printf 'def answer() -> int:\n    return 42\n' > runtime-acceptance/project/sample.py
          docker run --rm \
            --entrypoint /usr/local/bin/python3 \
            --volume "$PWD/runtime-acceptance/project:/acceptance/project:ro" \
            --volume "$PWD/runtime-acceptance/output:/acceptance/output" \
            "$exact_image" -P -c '
          import importlib.util
          import json
          import sys
          from pathlib import Path
          from frank_codegraph.service import Project, Supervisor
          import graphify
          assert sys.version_info[:3] == (3, 14, 6)
          assert importlib.util.find_spec("tarfile") is None
          assert importlib.util.find_spec("html.parser") is None
          assert importlib.util.find_spec("_tkinter") is None
          assert importlib.util.find_spec("tkinter") is None
          project = Project("acceptance", "Acceptance", Path("/acceptance/project"), ())
          Supervisor(Path("/acceptance/output"), [project])._build_and_publish(project)
          graph = json.loads((Path("/acceptance/output/acceptance/current/graphify-out/graph.json")).read_text())
          assert isinstance(graph.get("nodes"), list) and graph["nodes"]
          assert isinstance(graph.get("links", graph.get("edges")), list)
          '

      - name: Scan exact promoted digest with newest raw Grype database
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.IMAGE_CODEGRAPH }}@${{ steps.codegraph.outputs.digest }}
          fail-build: false
          severity-cutoff: high
          only-fixed: false
          by-cve: true
          cache-db: false
          output-format: json
          output-file: evidence/codegraph-grype-raw.json

      - name: Require exact unsuppressed Python finding set
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            [
              (.ignoredMatches // [])[] |
              select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            ] | length == 0
          ' evidence/codegraph-grype-raw.json >/dev/null
          jq -e '
            [(.matches // [])[] | select(.vulnerability.severity == "Critical")] | length == 0
          ' evidence/codegraph-grype-raw.json >/dev/null
          jq -e '
            [
              (.matches // [])[] |
              select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical") |
              .vulnerability.id
            ] | unique | sort == ["CVE-2026-11940", "CVE-2026-11972", "CVE-2026-15308"]
          ' evidence/codegraph-grype-raw.json >/dev/null
          jq -e '
            [
              (.matches // [])[] |
              select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical") |
              select(
                .artifact.name != "python" or
                .artifact.version != "3.14.6" or
                .artifact.purl != "pkg:generic/python@3.14.6" or
                ([.matchDetails[]?.searchedBy.package? | select(.name == "python" and .version == "3.14.6")] | length == 0)
              )
            ] | length == 0
          ' evidence/codegraph-grype-raw.json >/dev/null

      - name: Generate release-digest codegraph OpenVEX
        shell: bash
        env:
          CODEGRAPH_DIGEST: ${{ steps.codegraph.outputs.digest }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import { writeFileSync } from 'node:fs';

          const image = process.env.IMAGE_CODEGRAPH;
          const digest = process.env.CODEGRAPH_DIGEST;
          const repository = process.env.GITHUB_REPOSITORY;
          if (!image || !repository || !/^sha256:[a-f0-9]{64}$/.test(digest ?? '')) {
            throw new Error('invalid release image identity for OpenVEX');
          }
          const imageMatch = /^ghcr\.io\/([^/]+)\/frank-codegraph$/.exec(image);
          if (!imageMatch) throw new Error('invalid canonical codegraph repository');
          const digestHex = digest.slice('sha256:'.length);
          const imagePurl = `pkg:oci/frank-codegraph@sha256%3A${digestHex}?repository_url=${encodeURIComponent(`ghcr.io/${imageMatch[1]}`)}`;
          const pythonPurl = 'pkg:generic/python@3.14.6';
          const timestamp = new Date().toISOString();
          const evidence = {
            'CVE-2026-11940': 'The affected CPython tarfile implementation is physically absent. Image build and hosted runtime gates reject tarfile.py, bytecode caches, and importing tarfile, then complete a real Graphify extraction.',
            'CVE-2026-11972': 'The affected CPython tarfile streaming implementation is physically absent. Image build and hosted runtime gates reject tarfile.py, bytecode caches, and importing tarfile, then complete a real Graphify extraction.',
            'CVE-2026-15308': 'The affected CPython html.parser implementation is physically absent. Image build and hosted runtime gates reject html/parser.py, bytecode caches, and importing html.parser, then complete a real Graphify extraction.',
          };
          const product = {
            '@id': imagePurl,
            hashes: { 'sha-256': digestHex },
            subcomponents: [{ '@id': pythonPurl }],
          };
          const vex = {
            '@context': 'https://openvex.dev/ns/v0.2.0',
            '@id': `https://github.com/${repository}/security/openvex/${digestHex}`,
            author: `https://github.com/${repository}`,
            role: 'Document Creator',
            timestamp,
            version: 1,
            statements: Object.entries(evidence).map(([name, impact]) => ({
              vulnerability: { name },
              products: [product],
              status: 'not_affected',
              justification: 'vulnerable_code_not_present',
              impact_statement: impact,
              timestamp,
            })),
          };
          writeFileSync('evidence/codegraph.openvex.json', `${JSON.stringify(vex, null, 2)}\n`);
          NODE
          owner="${IMAGE_CODEGRAPH#ghcr.io/}"
          owner="${owner%/frank-codegraph}"
          product="pkg:oci/frank-codegraph@sha256%3A${CODEGRAPH_DIGEST#sha256:}?repository_url=ghcr.io%2F${owner}"
          jq -e --arg digest "${CODEGRAPH_DIGEST#sha256:}" --arg product "$product" '
            .["@context"] == "https://openvex.dev/ns/v0.2.0" and
            ([.statements[].vulnerability.name] | sort == ["CVE-2026-11940", "CVE-2026-11972", "CVE-2026-15308"]) and
            ([.statements[] | select(
              .status != "not_affected" or
              .justification != "vulnerable_code_not_present" or
              (.products | length != 1) or
              .products[0]["@id"] != $product or
              .products[0].hashes != {"sha-256": $digest} or
              .products[0].subcomponents != [{"@id": "pkg:generic/python@3.14.6"}]
            )] | length == 0)
          ' evidence/codegraph.openvex.json >/dev/null

      # GitHub's official OIDC attestation action records SLSA provenance for
      # the registry digest. Buildx also attaches provenance/SBOM attestations
      # during the single image build above.
      - name: Attest API build provenance
        id: api-provenance-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_API }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest web build provenance
        id: web-provenance-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_WEB }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Attest codegraph build provenance
        id: codegraph-provenance-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_CODEGRAPH }}
          subject-digest: ${{ steps.codegraph.outputs.digest }}
          push-to-registry: true

      - name: Attest codegraph SBOM
        id: codegraph-sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_CODEGRAPH }}
          subject-digest: ${{ steps.codegraph.outputs.digest }}
          sbom-path: evidence/codegraph.spdx.json
          push-to-registry: true

      - name: Verify exact returned SBOM bundle and signed document equality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEGRAPH_DIGEST: ${{ steps.codegraph.outputs.digest }}
          SBOM_BUNDLE_PATH: ${{ steps.codegraph-sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$SBOM_BUNDLE_PATH"
          cp "$SBOM_BUNDLE_PATH" evidence/codegraph.spdx.sigstore.json
          gh attestation verify "oci://$IMAGE_CODEGRAPH@$CODEGRAPH_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$SBOM_BUNDLE_PATH" \
            --deny-self-hosted-runners \
            --source-digest "$COMMIT_SHA" \
            --source-ref refs/heads/main \
            --signer-digest "$COMMIT_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-artifacts.yml" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json > evidence/codegraph.spdx.attestation.verify.json
          jq -e --arg name "$IMAGE_CODEGRAPH" --arg digest "${CODEGRAPH_DIGEST#sha256:}" '
            length == 1 and
            .[0].verificationResult.statement.predicateType == "https://spdx.dev/Document/v2.3" and
            (.[0].verificationResult.statement.subject == [{"name": $name, "digest": {"sha256": $digest}}])
          ' evidence/codegraph.spdx.attestation.verify.json >/dev/null
          jq -S -c . evidence/codegraph.spdx.json > "$RUNNER_TEMP/codegraph.spdx.local.canonical.json"
          jq -S -c '.[0].verificationResult.statement.predicate' \
            evidence/codegraph.spdx.attestation.verify.json \
            > evidence/codegraph.spdx.verified.json
          cmp --silent \
            "$RUNNER_TEMP/codegraph.spdx.local.canonical.json" \
            evidence/codegraph.spdx.verified.json

      - name: Sign and attest release-digest codegraph OpenVEX
        id: codegraph-vex-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_CODEGRAPH }}
          subject-digest: ${{ steps.codegraph.outputs.digest }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: evidence/codegraph.openvex.json
          push-to-registry: true

      - name: Verify exact returned OpenVEX bundle and extract signed predicate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEGRAPH_DIGEST: ${{ steps.codegraph.outputs.digest }}
          VEX_BUNDLE_PATH: ${{ steps.codegraph-vex-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$VEX_BUNDLE_PATH"
          cp "$VEX_BUNDLE_PATH" evidence/codegraph.openvex.sigstore.json
          gh attestation verify "oci://$IMAGE_CODEGRAPH@$CODEGRAPH_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$VEX_BUNDLE_PATH" \
            --deny-self-hosted-runners \
            --source-digest "$COMMIT_SHA" \
            --source-ref refs/heads/main \
            --signer-digest "$COMMIT_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-artifacts.yml" \
            --predicate-type https://openvex.dev/ns/v0.2.0 \
            --format json > evidence/codegraph.openvex.attestation.verify.json
          jq -e --arg name "$IMAGE_CODEGRAPH" --arg digest "${CODEGRAPH_DIGEST#sha256:}" '
            length == 1 and
            .[0].verificationResult.statement.predicateType == "https://openvex.dev/ns/v0.2.0" and
            (.[0].verificationResult.statement.subject == [{"name": $name, "digest": {"sha256": $digest}}])
          ' evidence/codegraph.openvex.attestation.verify.json >/dev/null
          jq -S -c . evidence/codegraph.openvex.json > "$RUNNER_TEMP/codegraph.openvex.local.canonical.json"
          jq -S -c '.[0].verificationResult.statement.predicate' \
            evidence/codegraph.openvex.attestation.verify.json \
            > evidence/codegraph.openvex.verified.json
          cmp --silent \
            "$RUNNER_TEMP/codegraph.openvex.local.canonical.json" \
            evidence/codegraph.openvex.verified.json

      - name: Scan exact promoted digest with verified signed OpenVEX
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.IMAGE_CODEGRAPH }}@${{ steps.codegraph.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          by-cve: true
          cache-db: false
          vex: evidence/codegraph.openvex.verified.json
          output-format: json
          output-file: evidence/codegraph-grype-vex.json

      - name: Require zero actionable High/Critical after verified OpenVEX
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            [
              (.matches // [])[] |
              select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            ] | length == 0
          ' evidence/codegraph-grype-vex.json >/dev/null

      - name: Attest workbench build provenance
        id: workbench-provenance-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_WORKBENCH }}
          subject-digest: ${{ steps.workbench.outputs.digest }}
          push-to-registry: true

      - name: Write release manifest
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          CODEGRAPH_DIGEST: ${{ steps.codegraph.outputs.digest }}
          WORKBENCH_DIGEST: ${{ steps.workbench.outputs.digest }}
          VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
          API_PROVENANCE_ATTESTATION_ID: ${{ steps.api-provenance-attestation.outputs.attestation-id }}
          API_PROVENANCE_STORAGE_RECORD_IDS: ${{ steps.api-provenance-attestation.outputs.storage-record-ids }}
          WEB_PROVENANCE_ATTESTATION_ID: ${{ steps.web-provenance-attestation.outputs.attestation-id }}
          WEB_PROVENANCE_STORAGE_RECORD_IDS: ${{ steps.web-provenance-attestation.outputs.storage-record-ids }}
          CODEGRAPH_PROVENANCE_ATTESTATION_ID: ${{ steps.codegraph-provenance-attestation.outputs.attestation-id }}
          CODEGRAPH_PROVENANCE_STORAGE_RECORD_IDS: ${{ steps.codegraph-provenance-attestation.outputs.storage-record-ids }}
          CODEGRAPH_SBOM_ATTESTATION_ID: ${{ steps.codegraph-sbom-attestation.outputs.attestation-id }}
          CODEGRAPH_SBOM_STORAGE_RECORD_IDS: ${{ steps.codegraph-sbom-attestation.outputs.storage-record-ids }}
          CODEGRAPH_VEX_ATTESTATION_ID: ${{ steps.codegraph-vex-attestation.outputs.attestation-id }}
          CODEGRAPH_VEX_STORAGE_RECORD_IDS: ${{ steps.codegraph-vex-attestation.outputs.storage-record-ids }}
          WORKBENCH_PROVENANCE_ATTESTATION_ID: ${{ steps.workbench-provenance-attestation.outputs.attestation-id }}
          WORKBENCH_PROVENANCE_STORAGE_RECORD_IDS: ${{ steps.workbench-provenance-attestation.outputs.storage-record-ids }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const required = [
            'COMMIT_SHA', 'IMAGE_API', 'IMAGE_WEB', 'IMAGE_CODEGRAPH', 'IMAGE_WORKBENCH',
            'API_DIGEST', 'WEB_DIGEST', 'CODEGRAPH_DIGEST', 'WORKBENCH_DIGEST',
            'GITHUB_REPOSITORY', 'VERIFY_RUN_ID',
            'API_PROVENANCE_ATTESTATION_ID', 'WEB_PROVENANCE_ATTESTATION_ID',
            'CODEGRAPH_PROVENANCE_ATTESTATION_ID', 'CODEGRAPH_SBOM_ATTESTATION_ID',
            'CODEGRAPH_VEX_ATTESTATION_ID', 'WORKBENCH_PROVENANCE_ATTESTATION_ID',
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`Missing ${key}`);
          }
          const evidenceFiles = [
            'api.spdx.json',
            'web.spdx.json',
            'codegraph.spdx.json',
            'codegraph.spdx.verified.json',
            'codegraph.spdx.sigstore.json',
            'codegraph.spdx.attestation.verify.json',
            'workbench.spdx.json',
            'codegraph.openvex.json',
            'codegraph.openvex.verified.json',
            'codegraph.openvex.sigstore.json',
            'codegraph.openvex.attestation.verify.json',
            'codegraph-grype-raw.json',
            'codegraph-grype-vex.json',
          ];
          const evidenceSha256 = Object.fromEntries(evidenceFiles.map((name) => [
            name,
            createHash('sha256').update(readFileSync(`evidence/${name}`)).digest('hex'),
          ]));
          const attestation = (prefix) => {
            const attestationId = process.env[`${prefix}_ATTESTATION_ID`];
            const rawStorageRecordIds = process.env[`${prefix}_STORAGE_RECORD_IDS`] ?? '';
            if (!rawStorageRecordIds.trim()) {
              return { attestation_id: attestationId, storage_record_ids: [], storage_records_supported: false };
            }
            let parsedStorageRecordIds;
            try {
              parsedStorageRecordIds = JSON.parse(rawStorageRecordIds);
            } catch {
              parsedStorageRecordIds = rawStorageRecordIds.split(/[\s,]+/).filter(Boolean);
            }
            const storageRecordIds = Array.isArray(parsedStorageRecordIds)
              ? parsedStorageRecordIds.map(String)
              : [String(parsedStorageRecordIds)];
            if (!attestationId || !Array.isArray(storageRecordIds) || storageRecordIds.length < 1 ||
                storageRecordIds.some((id) => typeof id !== 'string' || !id.trim())) {
              throw new Error(`Incomplete attestation outputs for ${prefix}`);
            }
            return { attestation_id: attestationId, storage_record_ids: storageRecordIds, storage_records_supported: true };
          };
          const manifest = {
            schema_version: 2,
            commit: process.env.COMMIT_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            verified_by: {
              workflow: 'verify',
              run_id: Number(process.env.VERIFY_RUN_ID),
            },
            images: {
              api: { reference: process.env.IMAGE_API, digest: process.env.API_DIGEST },
              web: { reference: process.env.IMAGE_WEB, digest: process.env.WEB_DIGEST },
              codegraph: { reference: process.env.IMAGE_CODEGRAPH, digest: process.env.CODEGRAPH_DIGEST },
              workbench: { reference: process.env.IMAGE_WORKBENCH, digest: process.env.WORKBENCH_DIGEST },
            },
            sbom: {
              api: 'api.spdx.json',
              web: 'web.spdx.json',
              codegraph: 'codegraph.spdx.json',
              codegraph_verified_predicate: 'codegraph.spdx.verified.json',
              codegraph_signed_bundle: 'codegraph.spdx.sigstore.json',
              codegraph_verification_receipt: 'codegraph.spdx.attestation.verify.json',
              codegraph_predicate_type: 'https://spdx.dev/Document/v2.3',
              workbench: 'workbench.spdx.json',
            },
            vex: {
              codegraph: 'codegraph.openvex.json',
              verified_predicate: 'codegraph.openvex.verified.json',
              signed_bundle: 'codegraph.openvex.sigstore.json',
              verification_receipt: 'codegraph.openvex.attestation.verify.json',
              predicate_type: 'https://openvex.dev/ns/v0.2.0',
            },
            security_reports: {
              codegraph_raw: 'codegraph-grype-raw.json',
              codegraph_policy: 'codegraph-grype-vex.json',
            },
            attestations: {
              api_provenance: attestation('API_PROVENANCE'),
              web_provenance: attestation('WEB_PROVENANCE'),
              codegraph_provenance: attestation('CODEGRAPH_PROVENANCE'),
              codegraph_sbom: attestation('CODEGRAPH_SBOM'),
              codegraph_vex: attestation('CODEGRAPH_VEX'),
              workbench_provenance: attestation('WORKBENCH_PROVENANCE'),
            },
            evidence_sha256: evidenceSha256,
            provenance: 'GitHub OIDC attestation attached to each registry digest',
          };
          writeFileSync('evidence/release-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Validate release manifest bindings
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          CODEGRAPH_DIGEST: ${{ steps.codegraph.outputs.digest }}
          WORKBENCH_DIGEST: ${{ steps.workbench.outputs.digest }}
          VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -s evidence/release-manifest.json
          node <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('evidence/release-manifest.json', 'utf8'));
          const digest = /^sha256:[a-f0-9]{64}$/;
          const expected = {
            commit: process.env.COMMIT_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            verifyRunId: Number(process.env.VERIFY_RUN_ID),
            api: { reference: process.env.IMAGE_API, digest: process.env.API_DIGEST },
            web: { reference: process.env.IMAGE_WEB, digest: process.env.WEB_DIGEST },
            codegraph: { reference: process.env.IMAGE_CODEGRAPH, digest: process.env.CODEGRAPH_DIGEST },
            workbench: { reference: process.env.IMAGE_WORKBENCH, digest: process.env.WORKBENCH_DIGEST },
          };
          if (!/^[0-9a-f]{40}$/.test(expected.commit)) throw new Error('Invalid verified commit');
          for (const image of [expected.api, expected.web, expected.codegraph, expected.workbench]) {
            if (!digest.test(image.digest)) throw new Error('Invalid build digest');
          }
          const expectedEvidence = [
            'api.spdx.json',
            'web.spdx.json',
            'codegraph.spdx.json',
            'codegraph.spdx.verified.json',
            'codegraph.spdx.sigstore.json',
            'codegraph.spdx.attestation.verify.json',
            'workbench.spdx.json',
            'codegraph.openvex.json',
            'codegraph.openvex.verified.json',
            'codegraph.openvex.sigstore.json',
            'codegraph.openvex.attestation.verify.json',
            'codegraph-grype-raw.json',
            'codegraph-grype-vex.json',
          ];
          if (JSON.stringify(Object.keys(manifest.evidence_sha256 ?? {}).sort()) !== JSON.stringify([...expectedEvidence].sort())) {
            throw new Error('Release manifest evidence hash set is incomplete');
          }
          for (const name of expectedEvidence) {
            const actual = createHash('sha256').update(readFileSync(`evidence/${name}`)).digest('hex');
            if (manifest.evidence_sha256[name] !== actual) throw new Error(`Evidence hash mismatch: ${name}`);
          }
          const expectedAttestations = [
            'api_provenance', 'web_provenance', 'codegraph_provenance',
            'codegraph_sbom', 'codegraph_vex', 'workbench_provenance',
          ];
          if (JSON.stringify(Object.keys(manifest.attestations ?? {}).sort()) !== JSON.stringify([...expectedAttestations].sort()) ||
              expectedAttestations.some((name) => {
                const record = manifest.attestations[name];
                return typeof record?.attestation_id !== 'string' || !record.attestation_id.trim() ||
                  typeof record.storage_records_supported !== 'boolean' ||
                  !Array.isArray(record.storage_record_ids) ||
                  (record.storage_records_supported && record.storage_record_ids.length < 1) ||
                  (!record.storage_records_supported && record.storage_record_ids.length !== 0) ||
                  record.storage_record_ids.some((id) => typeof id !== 'string' || !id.trim());
              })) {
            throw new Error('Release manifest attestation IDs are incomplete');
          }
          if (
            manifest.schema_version !== 2 ||
            manifest.commit !== expected.commit ||
            manifest.repository !== expected.repository ||
            manifest.verified_by?.workflow !== 'verify' ||
            manifest.verified_by?.run_id !== expected.verifyRunId ||
            manifest.images?.api?.reference !== expected.api.reference ||
            manifest.images?.api?.digest !== expected.api.digest ||
            manifest.images?.web?.reference !== expected.web.reference ||
            manifest.images?.web?.digest !== expected.web.digest ||
            manifest.images?.codegraph?.reference !== expected.codegraph.reference ||
            manifest.images?.codegraph?.digest !== expected.codegraph.digest ||
            manifest.images?.workbench?.reference !== expected.workbench.reference ||
            manifest.images?.workbench?.digest !== expected.workbench.digest ||
            manifest.sbom?.api !== 'api.spdx.json' ||
            manifest.sbom?.web !== 'web.spdx.json' ||
            manifest.sbom?.codegraph !== 'codegraph.spdx.json' ||
            manifest.sbom?.codegraph_verified_predicate !== 'codegraph.spdx.verified.json' ||
            manifest.sbom?.codegraph_signed_bundle !== 'codegraph.spdx.sigstore.json' ||
            manifest.sbom?.codegraph_verification_receipt !== 'codegraph.spdx.attestation.verify.json' ||
            manifest.sbom?.codegraph_predicate_type !== 'https://spdx.dev/Document/v2.3' ||
            manifest.sbom?.workbench !== 'workbench.spdx.json' ||
            manifest.vex?.codegraph !== 'codegraph.openvex.json' ||
            manifest.vex?.verified_predicate !== 'codegraph.openvex.verified.json' ||
            manifest.vex?.signed_bundle !== 'codegraph.openvex.sigstore.json' ||
            manifest.vex?.verification_receipt !== 'codegraph.openvex.attestation.verify.json' ||
            manifest.vex?.predicate_type !== 'https://openvex.dev/ns/v0.2.0' ||
            manifest.security_reports?.codegraph_raw !== 'codegraph-grype-raw.json' ||
            manifest.security_reports?.codegraph_policy !== 'codegraph-grype-vex.json'
          ) {
            throw new Error('Release manifest does not exactly bind the verified commit and image evidence');
          }
          NODE

      # Public registry access is a release property, not an operator-side
      # assumption. An empty CLI config ensures these are anonymous pulls.
      - name: Verify anonymous immutable image pulls
        shell: bash
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          CODEGRAPH_DIGEST: ${{ steps.codegraph.outputs.digest }}
          WORKBENCH_DIGEST: ${{ steps.workbench.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_docker_config="$(mktemp -d)"
          trap 'rm -rf -- "$anonymous_docker_config"' EXIT
          export DOCKER_CONFIG="$anonymous_docker_config"
          for image in \
            "$IMAGE_API@$API_DIGEST" \
            "$IMAGE_WEB@$WEB_DIGEST" \
            "$IMAGE_CODEGRAPH@$CODEGRAPH_DIGEST" \
            "$IMAGE_WORKBENCH@$WORKBENCH_DIGEST"; do
            docker pull "$image"
          done

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ env.COMMIT_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
