packages:
  - "apps/*"
  - "packages/*"
  - "modules/*"
  - "adapters/*"
  # FRANK-§17.1 names `adapters/storage/` as a family directory, and FRANK-§11.4
  # requires separated stores. One package per store inside that family (mirroring
  # the existing `packs/*/*` shape) keeps `adapters/storage/postgres` and a later
  # `adapters/storage/objectstore` independently versioned and independently
  # denied/allowed by the provider-SDK gate.
  - "adapters/*/*"
  - "packs/*/*"
  - "tools/*"
