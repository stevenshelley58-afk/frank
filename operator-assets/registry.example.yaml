    trigger:
      - initial skill configuration
      - issue tracker changes
      - triage label changes
      - domain documentation layout changes
    notes: "Use the pattern, but keep AGENTS.md hard rules authoritative."

  - id: grill-with-docs
    source: github:mattpocock/skills/skills/engineering/grill-with-docs
    status: active
    applies_to: [codex, hermes, frank]
    trigger:
      - large build
      - unclear plan
      - architecture decision
      - hard-to-reverse change
      - user asks for a bulletproof plan
    notes: "Read AGENTS.md, CONTEXT.md, and relevant ADRs before implementation."

  - id: to-prd
    source: github:mattpocock/skills/skills/engineering/to-prd
    status: active
    applies_to: [codex, hermes, frank]
    trigger:
      - settled feature intent
      - messy chat needs product shape
      - large task needs GitHub issue tracking
    notes: "Publish PRDs to GitHub Issues only when issue creation is requested."

  - id: to-issues
    source: github:mattpocock/skills/skills/engineering/to-issues
    status: active
    applies_to: [codex, hermes, frank]
    trigger:
      - PRD needs implementation slices
      - plan needs AFK-ready tasks
      - large work needs vertical breakdown
    notes: "Create independently implementable vertical slices, not layer-by-layer tasks."

  - id: tdd
    source: github:mattpocock/skills/skills/engineering/tdd
    status: active
    applies_to: [codex, hermes]
    trigger:
      - implement feature
      - fix bug
      - API route change
      - worker change
      - integration change
    notes: "Use red-green-refactor through public interfaces."

  - id: diagnose
    source: github:mattpocock/skills/skills/engineering/diagnose
    status: active
    applies_to: [codex, hermes, frank]
    trigger:
      - failing build
      - failing test
      - broken runtime behavior
      - production regression
      - performance regression
    notes: "Reproduce and minimize before patching."

  - id: zoom-out
    source: github:mattpocock/skills/skills/engineering/zoom-out
    status: active
    applies_to: [codex, hermes]
    trigger:
      - unfamiliar code area
      - refactor request
      - suspected local fix with system impact
    notes: "Use before structural changes that touch shared concepts."

  - id: improve-codebase-architecture
    source: github:mattpocock/skills/skills/engineering/improve-codebase-architecture
    status: active
    applies_to: [codex, hermes]
    trigger:
